name: predicators

on: [push]

jobs:
  debug-ci-only-failures:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: "3.10.14"
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-3.10.14-${{ hashFiles('setup.py') }}
        restore-keys: |
          pip-3.10.14-
    - run: |
        lscpu | head -20
        pip install -e .
        pip install pytest-cov==2.12.1 pytest-split
        python -c "import numpy; numpy.show_config()" | tail -20
        pip list 2>/dev/null | grep -i -E 'pybullet|numpy|scipy'
    - name: Bridge oracle planning 3-0
      run: |
        pytest -s "tests/approaches/test_oracle_process_planning_bridge.py::test_oracle_process_planning_solves_bridge_task[3-0]" -o log_cli=true --log-cli-level=INFO -p no:cacheprovider 2>&1 | grep -v -E '^\s*$' | tail -400
      env:
        PYTHONHASHSEED: 0
    - name: Boil sketch refinement
      if: always()
      run: |
        pytest -s "tests/approaches/test_agent_sim_learning_approach.py::test_boil_sketch_refinement" -o log_cli=true --log-cli-level=INFO -p no:cacheprovider 2>&1 | grep -v -E '^\s*$' | tail -300
      env:
        PYTHONHASHSEED: 0
