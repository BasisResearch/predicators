# The seven arms of the EMPIRIC benchmark. Each key is the approach half
# of the experiment id (<env>-<arm>_<round>). The shared flags in
# common.yaml give every arm the principled joint belief; No uncertainty
# turns it off. Arms gated on a deployable model on the test level set
# continual_require_model_on_test.
APPROACHES:
  # EMPIRIC: the agent writes a model of the world's physics, the harness
  # fits its parameters and keeps their uncertainty.
  mb_opus:
    NAME: agent_continual
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
  # Model-free: the same agent with the model-side machinery switched
  # off, so the two differ only in the model.
  mf_opus:
    NAME: agent_continual_model_free
    FLAGS: &mf_flags
      agent_sdk_model_name: claude-opus-5
      code_sim_learning_interval_belief: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_rollout_noise_filter: false
      code_sim_learning_carry_posterior: false
      code_sim_learning_fit_evidence: false
      continual_belief_frame: false
      agent_model_repair: false
      agent_planner_use_simulator: false
      continual_uncertainty_decisions: false
  # Model-free with the scene files an agentic real-to-sim agent would
  # build from: the engine wrapper, the scene manifest and the URDF and
  # mesh files as read-only references. Its prompt only asks it to solve
  # the levels; nothing asks for a simulator or model.
  mf_scene_package_opus:
    NAME: agent_continual_model_free
    FLAGS:
      <<: *mf_flags
      continual_provide_scene_package: true
  # Standalone: the agent writes and owns a program world model, with no
  # harness fitting.
  standalone_opus:
    NAME: agent_continual_program_world_model
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  # Oracle dynamics: the ground-truth simulator stands in for the learned
  # model, with no automatic execution gate or shadow audit (see
  # docs/comparisons/oracle-repair-notes.md).
  oracle_dynamics_opus:
    NAME: agent_continual_oracle_dynamics
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_skill_preflight: false
      continual_validation_audit: false
  # No fitting: EMPIRIC with only its declared parameters and no harness
  # parameter fitting (the agent may fit in its own sandbox code).
  no_fitting_opus:
    NAME: agent_continual_no_fitting
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      agent_sim_learn_declared_params_only: true
  # No uncertainty: EMPIRIC fitting raw noisy observations, with no state
  # smoothing, uncertainty margins, information seeking or joint belief.
  no_uncertainty_opus:
    NAME: agent_continual_no_uncertainty
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      code_sim_learning_rollout_noise_filter: false
      continual_belief_frame: false
      continual_uncertainty_decisions: false
      agent_sim_learn_param_uncertainty: false
      agent_plan_validation_rule_param_margin: false
      agent_plan_validation_physics_margin: false
      agent_explorer_info_seeking: false
      agent_explorer_info_seeking_adaptive: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_interval_belief: false
      code_sim_learning_carry_posterior: false
      belief_joint_draws: 0
      # Nothing about the observation noise is declared to this arm: no
      # noise section, no [noise] line, and the harness fit models none
      # of it.
      continual_obs_noise_declared: false
