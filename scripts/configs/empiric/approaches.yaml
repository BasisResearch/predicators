# The seven arms of the EMPIRIC benchmark, and EMPIRIC from assets, which
# is parked (SKIP): a launch runs it only when --approaches names it. Each
# key is the approach half of the experiment id (<env>-<arm>_<round>). The
# shared flags in common.yaml give every arm the principled joint belief;
# No uncertainty turns it off. Arms gated on a deployable model on the
# test level set continual_require_model_on_test.
APPROACHES:
  # EMPIRIC: the agent writes a model of the world's physics, the harness
  # fits its parameters and keeps their uncertainty.
  mb_opus:
    NAME: agent_continual
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
  # EMPIRIC from assets: EMPIRIC with no supplied domain base. The agent
  # builds its scene from SceneBase, the scene manifest and the asset files
  # (docs/amps/empiric-from-assets.md); fitting and uncertainty are
  # EMPIRIC's.
  from_assets_opus:
    NAME: agent_continual_from_assets
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      # Its starting values are the agent's guesses: a parameter the data
      # do not constrain keeps its whole declared range in the belief.
      code_sim_learning_prior_spans_bounds: true
      # Its model is the agent's own, so a test-level step waits for a
      # rehearsal of the plan on the joint belief from the observation.
      continual_rehearsal_gate: true
      # That step also waits until the agent has been shown its rehearsal's
      # notes: agents often print only a report's first line or the fields
      # they parse, and both round 27 losses had a warning left unprinted.
      continual_rehearsal_notes_gate: true
      # A test-level plan with a lost draw waits for a safer plan, a repair
      # or more data; a new plan starts from rest, not from a speed read
      # off noisy frames; and a restored state keeps its bodies' speeds.
      continual_rehearsal_safe_plan: true
      continual_rehearsal_still_start: true
      continual_restage_velocities: true
      # A rehearsal scores its rollout at the fit's point estimate, where
      # the planning model runs, as it scores a draw, and says when that
      # rollout loses, or solves, where no draw does.
      continual_rehearsal_mean_verdict: true
      # On a test level it acts on the rehearsed plan with the highest
      # P-hat; cost only breaks ties.
      continual_rehearsal_win_first: true
      # A request whose outcome lies outside its rehearsal's draws widens
      # the fitted program's belief.
      continual_predictive_check: true
      # A rehearsal staged while a body moves keeps it moving, at the
      # velocity the state belief estimates from the noisy frames.
      continual_belief_velocities: true
      # A fit traces lines for the materials the model leaves undeclared,
      # so the joint draws of them follow the recordings.
      belief_material_lines: true
      # A rehearsal counts the failing draws that end the episode in
      # GAME_OVER, and the draws that stopped at a failed skill.
      continual_rehearsal_game_over: true
      # A rehearsal names the scored features its most likely rollout takes
      # past the range the recordings show.
      continual_rehearsal_support_note: true
      # It also names the scored bodies that rollout moves faster than any
      # recording shows under the same switches.
      continual_rehearsal_speed_note: true
      # A fit report names the scored features whose replays at the fitted
      # values stop short of how far they went in the recordings, and a
      # rehearsal of that model repeats it.
      continual_fit_reach_check: true
      # A fit report names the parameters held at an end of their declared
      # range, and a rehearsal of that model repeats it.
      continual_fit_bound_note: true
      # A box or sphere body takes each level's observed size, so the fit
      # can replay every level's recordings with one model.
      scene_observed_sizes: true
      # The belief's temperature is set per recorded segment, so more
      # recordings narrow it.
      belief_segment_temperature: true
      # A resting body's position averages every frame since it last
      # moved, up to 64, so a rehearsal draws it about as tightly as the
      # frames allow; under the 8-frame default its spread stays at a third
      # of the noise however long it rests.
      continual_belief_window: 64
      # A reached level's initial state, as its list of levels gives it, is
      # the pooled belief over every episode's opening frames, not episode
      # zero's first noisy frame.
      continual_pooled_level_init: true
      # After a reset of a training level it has not won, a skill request
      # waits for the model and a rehearsal, as on a test level.
      continual_practise_after_reset: true
      # At set points a skill request waits for a record of the belief the
      # step leans on, its direct tests, a rival and a separating experiment.
      continual_claim_check: true
      # Undeclared engine materials keep the scene's own values in the fit
      # and in every draw; the belief covers the declared parameters.
      belief_keep_undeclared_materials: true
      # The harness loads every level's bodies from its scene manifest; the
      # model adds the masses, materials, readings and mechanisms.
      scene_manifest_loader: true
  # EMPIRIC from assets with the agent's own parameter belief: the agent
  # builds its scene as in EMPIRIC from assets, the harness fits nothing,
  # and the agent estimates its parameters by any method and supplies their
  # uncertainty as parameter draws (PARAM_DRAWS) that rehearsals, execution
  # monitoring and the predictive check run on. Parked like EMPIRIC from
  # assets.
  from_assets_agent_belief_opus:
    NAME: agent_continual_from_assets_agent_belief
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      # No harness estimation: sim.fit refuses, and each declaration's
      # init_value is the point estimate the deployed model runs.
      agent_sim_learn_declared_params_only: true
      # The rest is EMPIRIC from assets' menu, less the switches that act
      # on a fit (its reach check, bound note, material lines and segment
      # temperatures).
      continual_rehearsal_gate: true
      continual_predictive_check: true
      continual_belief_velocities: true
      continual_rehearsal_game_over: true
      continual_rehearsal_support_note: true
      scene_observed_sizes: true
      continual_belief_window: 64
      continual_pooled_level_init: true
  # No learning: EMPIRIC from assets with all learning of the physics
  # removed. The harness supplies the simulator: the domain-general base
  # with each level's scene loaded from its manifest and asset files, as
  # for Direct + base simulator, and nothing else. The agent writes no
  # model file, and the harness loads none of its files and estimates
  # nothing. The agent keeps EMPIRIC from assets' planning workflow on that
  # simulator: the state belief, rehearsals on the joint draws (a draw is
  # a start state with its own planner seed, since the arm has no
  # parameters), plan refinement, the rehearsal gate and the reward model.
  # The rest is EMPIRIC from assets' menu, less the switches that act on
  # a model file, a fit or a parameter. Parked like EMPIRIC from assets.
  # Nothing the agent reads names what the arm does not have. The agent
  # reads its run folder's path, which holds the approach's name and this
  # key, so both say only what the arm has: a scene from assets.
  from_assets_scene_opus:
    NAME: agent_continual_from_assets_scene
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      # The harness estimates nothing, and nothing the agent reads names an
      # estimate; a traceback it is shown leaves out the harness's frames.
      agent_sim_learn_declared_params_only: true
      agent_sim_learn_fit_invisible: true
      # A test-level step waits for a rehearsal of the plan on the joint
      # draws from the observation, and for its notes to be shown.
      continual_rehearsal_gate: true
      continual_rehearsal_notes_gate: true
      # A test-level plan with a lost draw waits for a safer plan; a new
      # plan starts from rest; and a restored state keeps its bodies' speeds.
      continual_rehearsal_safe_plan: true
      continual_rehearsal_still_start: true
      continual_restage_velocities: true
      # A rehearsal scores its rollout from the belief mean as it scores a
      # draw, and says when that rollout loses, or solves, where no draw
      # does.
      continual_rehearsal_mean_verdict: true
      continual_rehearsal_win_first: true
      # A request whose outcome lies outside its rehearsal's draws, on the
      # pose of a body, is reported; the draws stay as they are.
      continual_predictive_check: true
      continual_belief_velocities: true
      continual_rehearsal_game_over: true
      scene_observed_sizes: true
      continual_belief_window: 64
      continual_pooled_level_init: true
      # After a reset of a training level it has not won, a skill request
      # waits for a rehearsal, as on a test level.
      continual_practise_after_reset: true
      continual_claim_check: true
      # The harness loads every level's bodies from its scene manifest.
      scene_manifest_loader: true
      # The source of the simulator, as EMPIRIC from assets reads it,
      # listed for reference only.
      continual_provide_simulator_source: true
  # No uncertainty, from assets: EMPIRIC from assets with no explicit
  # uncertainty. The agent writes its model as in EMPIRIC from assets and
  # the harness fits its parameters, to the raw noisy observations; every
  # rollout runs one value for each parameter from the latest observation.
  # There is no state smoothing, no belief and no joint draw, so the
  # harness runs no rehearsal: every switch of EMPIRIC from assets that
  # gates on one, adds a note to one or checks a step against one is left
  # out, and the approach class refuses a config that turns one on. The
  # agent still rolls plans out in its fitted model with `sim`. Parked
  # like EMPIRIC from assets. The agent reads its run folder's path, which
  # holds the approach's name and this key, so neither names what the arm
  # leaves out: "point" stands for a model at one value per parameter.
  from_assets_point_opus:
    NAME: agent_continual_from_assets_point
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      # Nothing the agent reads names the noise, a belief, a draw or a
      # stress test, and its probe has no call built on one.
      continual_point_values_only: true
      # A test-level step waits for a model that loads and, since its
      # starting values are the agent's guesses, for a fit of the current
      # file. No rehearsal is asked for.
      continual_require_model_on_test: true
      # No uncertainty's switches: they turn off what common.yaml turns on.
      code_sim_learning_rollout_noise_filter: false
      continual_belief_frame: false
      continual_uncertainty_decisions: false
      agent_sim_learn_param_uncertainty: false
      agent_explorer_info_seeking: false
      agent_explorer_info_seeking_adaptive: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_interval_belief: false
      code_sim_learning_carry_posterior: false
      belief_joint_draws: 0
      # Nothing about the observation noise is declared to this arm: no
      # noise section, no [noise] line, and the harness fit models none
      # of it.
      continual_obs_noise_declared: false
      # From EMPIRIC from assets, the switches that act on the fit and the
      # scene. The fit starts from the agent's guesses: its prior spans
      # each declared range and its search covers the whole range, so a
      # guess does not hold the fitted value near itself.
      code_sim_learning_prior_spans_bounds: true
      # A box or sphere body takes each level's observed size, and the
      # harness loads every level's bodies from its scene manifest.
      scene_observed_sizes: true
      scene_manifest_loader: true
      # A state restored in the model keeps its bodies' speeds.
      continual_restage_velocities: true
      # An observation carries no body speed, as for EMPIRIC from assets.
      # Off, each noisy frame would carry the true speeds. No belief
      # estimates a speed here, so a rollout from an observation starts at
      # rest.
      continual_belief_velocities: true
  # No harness fitting, on EMPIRIC from assets: the agent writes its model
  # as EMPIRIC from assets does (mechanisms and declared parameters, under
  # the scene loader), and the harness estimates nothing. The model runs
  # at the values its declarations give, and a rehearsal draws each
  # parameter around its declared value, inside its declared range (as the
  # No fitting arm does). Nothing tells the agent that a
  # harness fit exists (it may fit in its own sandbox code). The rest is
  # EMPIRIC from assets' menu, less the switches that act on a harness
  # fit: the range-spanning prior, the material lines, the segment
  # temperatures, the reach check and the bound note. Parked like EMPIRIC
  # from assets. The agent reads its run folder's path, which holds the
  # approach's name and this key, so neither names a fit: "declared" stands
  # for a model at its declared values.
  from_assets_declared_opus:
    NAME: agent_continual_from_assets_declared
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      # No harness estimation: each declaration's init_value is the value
      # the deployed model runs, and its [lo, hi] bounds the rehearsal
      # draws of that parameter.
      agent_sim_learn_declared_params_only: true
      # Nothing the agent reads names a harness fit, and its probe has no
      # fit entry point.
      agent_sim_learn_fit_invisible: true
      continual_rehearsal_gate: true
      continual_rehearsal_notes_gate: true
      continual_rehearsal_safe_plan: true
      continual_rehearsal_still_start: true
      continual_restage_velocities: true
      # A rehearsal scores its rollout at the declared values, where the
      # planning model runs, as it scores a draw.
      continual_rehearsal_mean_verdict: true
      continual_rehearsal_win_first: true
      # A request whose outcome lies outside its rehearsal's draws is
      # reported; the draws stay as the declarations give them.
      continual_predictive_check: true
      continual_belief_velocities: true
      continual_rehearsal_game_over: true
      continual_rehearsal_support_note: true
      continual_rehearsal_speed_note: true
      scene_observed_sizes: true
      continual_belief_window: 64
      continual_pooled_level_init: true
      continual_practise_after_reset: true
      continual_claim_check: true
      # Undeclared engine materials keep the scene's own values in every
      # draw; the draws cover the declared parameters.
      belief_keep_undeclared_materials: true
      scene_manifest_loader: true
  # Model-free: the same agent with the model-side machinery switched
  # off, so the two differ only in the model.
  mf_opus:
    NAME: agent_continual_model_free
    FLAGS: &mf_flags
      agent_sdk_model_name: claude-opus-5
      code_sim_learning_interval_belief: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_rollout_noise_filter: false
      code_sim_learning_carry_posterior: false
      code_sim_learning_fit_evidence: false
      continual_belief_frame: false
      agent_model_repair: false
      agent_planner_use_simulator: false
      continual_uncertainty_decisions: false
      # The level's reward model on states the agent predicts, as the
      # evaluate_trajectory tool. No engine backs it: a rule that replays
      # physics (the domino push) is not checked, and the note says so.
      continual_provide_reward_model: true
      # The arm has no rehearsal, so the Domino goal text names none.
      domino_goal_names_rehearsal: false
  # Model-free with the scene assets EMPIRIC from assets builds from: the
  # scene manifest and the URDF and mesh files as read-only references. Its
  # prompt only asks it to solve the levels; nothing asks for a simulator
  # or model.
  mf_scene_package_opus:
    NAME: agent_continual_model_free
    FLAGS:
      <<: *mf_flags
      continual_provide_scene_package: true
  # The Direct agent and Direct + scene of the rebuttal cohort: mf_opus
  # and mf_scene_package_opus under a class and menu keys that say nothing
  # of what the arms leave out, because the agent can read its run
  # folder's path. Parked like EMPIRIC from assets.
  # Neither has the skill reference file, as EMPIRIC from assets has
  # none; Direct + scene also reads the scene of each level played so
  # far, as EMPIRIC from assets does.
  direct_opus:
    NAME: agent_continual_direct
    SKIP: true
    FLAGS:
      <<: *mf_flags
      continual_provide_skills_reference: false
  direct_scene_opus:
    NAME: agent_continual_direct
    SKIP: true
    FLAGS:
      <<: *mf_flags
      continual_provide_scene_package: true
      continual_provide_skills_reference: false
      continual_provide_level_scenes: true
  # Direct + base simulator: Direct + scene with one more tool, the
  # domain-general base simulator with each level's scene loaded from its
  # manifest and asset files, as the base of EMPIRIC from assets loads it.
  # The agent can run the robot's skills in it from an observed state and
  # read the states it predicts, at the loaded physical values or at
  # values it names, so it can fit them with its own code. The arm has no
  # model file, no harness fit, no belief and no gate, and no interface for
  # adding mechanisms to the simulator. The level's reward model is a
  # helper beside the simulator, and a rule that replays physics replays
  # in it. Parked like EMPIRIC from assets.
  direct_base_sim_opus:
    NAME: agent_continual_direct_base_sim
    SKIP: true
    FLAGS:
      <<: *mf_flags
      continual_provide_scene_package: true
      # The simulator's scene, as EMPIRIC from assets has it: the harness
      # loads every level's bodies from its scene manifest, and a box or
      # sphere body takes each level's observed size.
      scene_manifest_loader: true
      scene_observed_sizes: true
      # What EMPIRIC from assets reads, less the skill reference file it
      # does not have: the scene of each level played so far, and the
      # simulator's source, listed for reference only.
      continual_provide_skills_reference: false
      continual_provide_level_scenes: true
      continual_provide_simulator_source: true
  # Standalone: the agent writes and owns a program world model, with no
  # harness fitting. It receives the scene assets Direct + scene receives,
  # and no base simulator. It scores the states its model predicts with the
  # level's reward model (evaluate_trajectory in run_python), with no
  # engine behind it, as the two direct arms do.
  standalone_opus:
    NAME: agent_continual_program_world_model
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_provide_scene_package: true
      continual_provide_reward_model: true
      # The reward model replays nothing here, so the Domino goal text
      # names no rehearsal that replays.
      domino_goal_names_rehearsal: false
      # No belief over the observation, as in the direct arms: the
      # observation is the raw noisy frame and shows no belief block.
      continual_uncertainty_decisions: false
      continual_belief_frame: false
      # The model is the agent's world_model.py alone: no invented
      # predicates (predicates.py).
      program_world_model_invent_predicates: false
      # As EMPIRIC from assets: no skill reference file, and the scene of
      # each level played so far.
      continual_provide_skills_reference: false
      continual_provide_level_scenes: true
  # Oracle dynamics: the ground-truth simulator stands in for the learned
  # model, with no automatic execution gate or shadow audit (see
  # docs/comparisons/oracle-repair-notes.md).
  oracle_dynamics_opus:
    NAME: agent_continual_oracle_dynamics
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_skill_preflight: false
      continual_validation_audit: false
  # No fitting: EMPIRIC with only its declared parameters and no harness
  # parameter fitting (the agent may fit in its own sandbox code).
  no_fitting_opus:
    NAME: agent_continual_no_fitting
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      agent_sim_learn_declared_params_only: true
  # No uncertainty: EMPIRIC fitting raw noisy observations, with no state
  # smoothing, uncertainty margins, information seeking or joint belief.
  no_uncertainty_opus:
    NAME: agent_continual_no_uncertainty
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      code_sim_learning_rollout_noise_filter: false
      continual_belief_frame: false
      continual_uncertainty_decisions: false
      agent_sim_learn_param_uncertainty: false
      agent_explorer_info_seeking: false
      agent_explorer_info_seeking_adaptive: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_interval_belief: false
      code_sim_learning_carry_posterior: false
      belief_joint_draws: 0
      # Nothing about the observation noise is declared to this arm: no
      # noise section, no [noise] line, and the harness fit models none
      # of it.
      continual_obs_noise_declared: false
