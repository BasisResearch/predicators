# The direct agent with the scene files (Sept 19, 2026): the agentic
# real-to-sim arm's engine wrapper, scene manifest and URDF and mesh
# files as read-only references, and a prompt that only asks it to solve
# the levels (mf_scene_package_opus). Opus, three seeds each: 5 domains x
# 3 seeds = 15 runs, so the logs land under
# logs/agent_continual_model_free/<env>-mf_scene_package_opus_benchmark_r1/seed<N>.
#
# python scripts/engaging/launch.py -c predicatorv3/continual_direct_scene_files_benchmark_r1.yaml --partition mit_preemptable,mit_normal --requeue --accounts b,d
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 0
NUM_SEEDS: 3
ENVS:
  balloons:
    SKIP: false
  bridge:
    SKIP: false
  boil:
    SKIP: false
  fan:
    SKIP: false
  domino_high_friction_turn:
    SKIP: false
APPROACHES:
  mf_scene_package_opus_benchmark_r1:
    EXTENDS: mf_scene_package_opus
