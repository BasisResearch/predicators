# Thin launcher: run the busyboard experiment (one arm at a time).
# Usage: python scripts/local/launch_simp.py -c predicatorv3/exp_busyboard.yaml --parallel
# Env definitions live in envs/all.yaml and approach definitions in
# approaches/all.yaml (all parked by default); this file only un-skips the
# env + arm(s) it runs. To run a baseline sweep, flip additional arms'
# SKIP to False here.
#
# The env block carries --sesame_check_expected_atoms False, which this
# domain requires; see envs/all.yaml for why. The demonstrator
# (oracle_process_planning) solves 10/10 test tasks with it.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ENVS:
  busyboard:
    SKIP: False
  # busyboard has no agent-specific excluded_predicates. The wiring
  # helper predicates (SoleDriver / JointDrivers) are injected for the
  # oracle only, so they are not in env.predicates and an agent already
  # runs over the physical vocabulary without them.
APPROACHES:
  # Oracle hybrid-sim arm: solved 1/1 with the minimal plan (job 21840975).
  agent_oracle_hybrid_sim:
    SKIP: True
  sim_predicator:
    SKIP: False
    ARGS:
      - auto_resume # resume the latest per-cycle checkpoint on requeue
