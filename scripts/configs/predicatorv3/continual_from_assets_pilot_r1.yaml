# Two seeds each on Fan + ramp, Bridge, Domino, Balloons and Boil.
# No environment changes, no mandatory preflight, separate result cohort.
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 0
NUM_SEEDS: 2
FLAGS:
  continual_skill_preflight: false
  continual_validation_audit: false
ENVS:
  fan_ramp:
    EXTENDS: fan
    FLAGS:
      fan_exposed_transfer: true
      fan_inertial_transfer: true
      fan_ramp_transfer: true
      fan_ramp_landing_extension: 0.10
      fan_ramp_rise: 0.003
      fan_train_num_walls_per_task: "[0]"
      fan_test_num_walls_per_task: "[0]"
      fan_test_num_pos_x: 3
      fan_test_num_pos_y: 3
      fan_train_task_generation: uniform
      fan_test_task_generation: uniform
  bridge:
    SKIP: false
  domino_high_friction_turn:
    SKIP: false
  balloons:
    SKIP: false
  boil:
    SKIP: false
APPROACHES:
  from_assets_opus_pilot_r1:
    EXTENDS: from_assets_opus
