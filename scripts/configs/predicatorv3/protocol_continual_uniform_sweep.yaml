# Uniform continual-protocol sweep: model-based vs model-free across the five
# domains where the model-based agent has shown an advantage (balloons, boil,
# bridge, domino, fan). One arm flag set is applied uniformly; only the
# env-intrinsic pieces differ (physics, horizon, bridge's larger step cap, and
# balloons' two train levels). Noiseless setting (continual_obs_noise_* default
# to 0.0). Seed 0 first; raise NUM_SEEDS to 3 once seed 0 looks right.
#
# Usage:
#   python scripts/engaging/launch.py \
#       -c predicatorv3/protocol_continual_uniform_sweep.yaml \
#       --partition mit_preemptable --accounts a,b
#
# Run dirs: logs/agent_continual/<env>-agent_continual_uniform/seed<k>/ and
#           logs/agent_continual_model_free/<env>-agent_continual_model_free_uniform/seed<k>/.
---
START_SEED: 0
NUM_SEEDS: 1
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ARGS:
  # A requeue (preemption or the wall-time trap) resumes the run in its
  # directory from the scorecard and the level recording.
  - auto_resume
FLAGS:
  experiment_protocol: "continual"
  continual_levels: "train_then_test"
  continual_steps_per_level: 5000
  continual_wall_clock_hours: 48.0
  continual_render: True
  continual_make_video: True
  test_fresh_env_per_episode: True
  continual_runs_dir: "/home/ycliang/predicators/logs"
  log: "/home/ycliang/predicators/logs/"
ENVS:
  boil:
    SKIP: False
  bridge:
    SKIP: False
    FLAGS:
      continual_steps_per_level: 10000
  domino_high_friction_turn:
    SKIP: False
  fan:
    SKIP: False
  balloons:
    SKIP: False
    FLAGS:
      # Contact-only generation is the env default now; balloons just needs
      # its two train levels.
      num_train_tasks: 2
APPROACHES:
  oracle:
    SKIP: True
  random_primitives:
    NAME: "random_actions"
    SKIP: True
  random_skills:
    NAME: "random_options"
    SKIP: True
  # Model-based arm: hybrid simulator + parameter fit + predicate invention,
  # with the adaptive uncertainty flags (margin gate always on, info-seeking
  # with adaptive proactive probing). Same flag set the polished balloons
  # contact run used (MB 3/3).
  agent_continual_uniform:
    NAME: "agent_continual"
    SKIP: False
    FLAGS:
      agent_sdk_use_local_sandbox: True
      partially_observable: True
      agent_sdk_max_agent_turns_per_iteration: 10000
      agent_sdk_image_max_px: 900
      agent_bilevel_use_llm_initial_params: True
      agent_solve_use_journal: True
      agent_validation_parallel_workers: 6
      code_sim_learning_rollout_min_posterior_width: 0.1
      continual_max_idle_rounds: 5
      agent_plan_validation_rule_param_margin: True
      agent_explorer_info_seeking: True
      agent_explorer_info_seeking_adaptive: True
  # Model-free baseline: same env + skill tools, sandbox and journal, no
  # simulator and no learning session.
  agent_continual_model_free_uniform:
    NAME: "agent_continual_model_free"
    SKIP: False
    FLAGS:
      agent_sdk_use_local_sandbox: True
      partially_observable: True
      agent_planner_use_simulator: False
      agent_solve_use_journal: True
      agent_sdk_max_agent_turns_per_iteration: 10000
      agent_sdk_image_max_px: 900
      continual_max_idle_rounds: 5
