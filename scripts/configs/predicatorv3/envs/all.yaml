ENVS:
  domino:
    NAME: "pybullet_domino"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
  domino_turns:
    NAME: "pybullet_domino"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      domino_test_turn_ratio: 1.0
  # Min-block friction-sysID tasks (reward = toppled - block_cost * blues); one
  # block per mismatch direction. Forward: true friction below the planner's.
  domino_low_friction:
    NAME: "pybullet_domino"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20 # raise to avoid placement collisions
      pybullet_birrt_path_subsample_ratio: 2
      domino_min_block_tasks: True
      domino_true_friction: 0.1
      domino_planning_friction: 0.5
      domino_min_block_span_lo: 0.13
      domino_min_block_span_hi: 0.30
      domino_min_block_num_blues: 4
  # Reverse: true friction above the planner's, so it over-builds and pays
  # per-block cost. Geometry retuned 2026-07-12 (probe_min_block_bands.py).
  domino_high_friction:
    NAME: "pybullet_domino"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20 # raise to avoid placement collisions
      pybullet_birrt_path_subsample_ratio: 2
      domino_min_block_tasks: True
      # Spans / turn legs: true K* 1 (2 on turns) vs believed 2 (3); four
      # staged blues give the believed build a spare.
      domino_true_friction: 0.5
      domino_planning_friction: 0.1
      domino_min_block_span_lo: 0.29
      domino_min_block_span_hi: 0.31
      domino_min_block_turn_entry_lo: 0.21
      domino_min_block_turn_entry_hi: 0.24
      domino_min_block_turn_exit_lo: 0.17
      domino_min_block_turn_exit_hi: 0.20
      domino_min_block_num_blues: 4
      domino_block_cost: 0.1 # doubled so one extra blue shows as a 0.1 gap
      online_learning_early_stopping_ignore_reward_bar: True
  # domino_high_friction with all-turn test tasks; exp_domino.yaml's env.
  domino_high_friction_turn:
    NAME: "pybullet_domino"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20 # raise to avoid placement collisions
      pybullet_birrt_path_subsample_ratio: 2
      domino_min_block_tasks: True
      domino_true_friction: 0.5
      domino_planning_friction: 0.1
      domino_min_block_span_lo: 0.29
      domino_min_block_span_hi: 0.31
      domino_min_block_turn_entry_lo: 0.21
      domino_min_block_turn_entry_hi: 0.24
      domino_min_block_turn_exit_lo: 0.17
      domino_min_block_turn_exit_hi: 0.20
      domino_min_block_num_blues: 4
      domino_block_cost: 0.1
      domino_test_turn_ratio: 1.0
      online_learning_early_stopping_ignore_reward_bar: True
  # domino_high_friction_turn on the real scene's setup (Panda + table tile);
  # only the robot and table change, so differences are attributable to them.
  domino_high_friction_turn_real:
    NAME: "pybullet_domino_real_geometry"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      domino_min_block_tasks: True
      domino_true_friction: 0.5
      domino_planning_friction: 0.1
      domino_min_block_span_lo: 0.29
      domino_min_block_span_hi: 0.31
      # Turn legs are the Fetch values and do NOT certify on the Panda (test
      # split empty); recalibration is parked, see CALIBRATION_NOTES.md.
      domino_min_block_turn_entry_lo: 0.21
      domino_min_block_turn_entry_hi: 0.24
      domino_min_block_turn_exit_lo: 0.17
      domino_min_block_turn_exit_hi: 0.20
      domino_min_block_num_blues: 4
      domino_block_cost: 0.1
      domino_test_turn_ratio: 1.0
      online_learning_early_stopping_ignore_reward_bar: True
      pybullet_robot: "panda"
      # Required for the Panda: rests the closed fingers on the 0.015 m
      # domino's faces (grasp detection tolerance 0.0005).
      pybullet_closed_fingers: 0.008
  # Real-world domino: learn and explore in sim on the reconstructed scene,
  # test on the real Franka. The scene JSON sizes the env; set no counts here.
  domino_real:
    NAME: "pybullet_domino_real"
    SKIP: True
    # store_true flags go in ARGS (bare --flag), never in FLAGS.
    ARGS:
      - "make_test_images"
      - "make_failure_images"
    FLAGS:
      num_test_tasks: 1  # one reconstructed scene
      max_initial_demos: 0  # the grid oracle cannot solve the real scene
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 400
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      option_model_use_gui: False
      agent_bilevel_log_state: False
      agent_sim_learn_oracle_sim_program: False
      agent_sim_learn_oracle_sim_params: False
      pybullet_robot: "panda"
      domino_use_skill_factories: True
      domino_real_scene: "/home/amberli/babyrobot/BabyRobotPredicator/scenes/domino_straight.json"
      # Roles by id (green start, purple target); ignored if the scene has 'role'.
      domino_real_start_id: 6
      domino_real_target_id: 5
      pybullet_closed_fingers: 0.015 # fingers on the 0.029 m real domino's faces
      real_robot_execute: False
  # Heavy-block (immovable obstacle) tasks, mass-only mismatch; exp_domino_heavy.yaml.
  domino_heavy:
    NAME: "pybullet_domino"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20 # raise to avoid placement collisions
      pybullet_birrt_path_subsample_ratio: 2
      domino_heavy_block_tasks: True
      domino_min_block_num_blues: 4
      domino_test_turn_ratio: 1.0
  # Domino + fan, no ball: the fan blows the START (green) domino, so the
  # task is a pure layout problem - arrange the chain so that switching the
  # fan on topples the target. The robot never pushes anything itself.
  #
  # Runs: the oracle solves it 1/1 at reward 0.900 (robot bridges start
  # to target with two blues, presses the switch, wind topples the
  # chain). GT types/predicates/options/processes are registered in
  # ground_truth_models/domino/, and the wind's residual dynamics -
  # with wind_force and wind_lever as FITTED parameters - live in
  # ground_truth_models/domino_fan/gt_simulator.py, which is what a
  # learning arm has to recover.
  #
  # These tasks DO carry a DominoEvaluator, with TurnFanOn as the
  # sanctioned trigger instead of Push: reward is
  # 1[goal reached via a certified wind cascade] - 0.05 per blue used,
  # so 0.900 is a two-blue solve. An episode where the arm knocks the
  # target over earns no bonus. Ball variants still get no evaluator.
  domino_fan:
    NAME: "pybullet_domino_fan"
    SKIP: True  # un-skipped by exp_domino_fan.yaml
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      fan_known_controls_relation: True
      fan_fans_blow_opposite_direction: False
      # Lay each chain along one fan's wind axis. Without this the
      # generator points chains anywhere, and a chain across the wind
      # cannot cascade however hard the fan blows - the task is
      # unsolvable before a planner sees it.
      domino_fan_aligned_tasks: True
      # Sized so the block moves before Wait declares the scene settled
      # (onset 7 steps at 1.5 N against Wait's ~11), not just to clear
      # the 0.123 N tipping threshold. See settings.py.
      domino_fan_wind_force: 1.5
      # Straight chains only. Alignment guarantees the FIRST leg runs
      # downwind; a turn puts the rest of the chain across the wind,
      # and the turn geometry was tuned for a robot push anyway.
      domino_test_turn_ratio: 0.0
      domino_train_turn_ratio: 0.0
  # The same task with the BUTTON removed: instead of pressing a
  # switch, the robot runs DeclareFinished and the fan starts. Same
  # scene, same wind, same certificate - only the trigger changes.
  #
  # Two reasons it is its own env. A physical button is awkward on a
  # real arm: it has to be reachable from every staging pose, the
  # approach must not sweep through the chain just built, and a missed
  # press is indistinguishable from one that did not take. And for a
  # LEARNING arm the declaration is the cleaner question - nothing is
  # touched, so there is no contact to credit the wind to, and an
  # agent that finds the relation has found a causal one.
  domino_declare:
    NAME: "pybullet_domino_declare"
    SKIP: True  # un-skipped by run_rung.sh --declare
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      fan_known_controls_relation: True
      fan_fans_blow_opposite_direction: False
      # Lay each chain along one fan's wind axis. Without this the
      # generator points chains anywhere, and a chain across the wind
      # cannot cascade however hard the fan blows - the task is
      # unsolvable before a planner sees it.
      domino_fan_aligned_tasks: True
      # Sized so the block moves before Wait declares the scene settled
      # (onset 7 steps at 1.5 N against Wait's ~11), not just to clear
      # the 0.123 N tipping threshold. See settings.py.
      domino_fan_wind_force: 1.5
      # Straight chains only. Alignment guarantees the FIRST leg runs
      # downwind; a turn puts the rest of the chain across the wind,
      # and the turn geometry was tuned for a robot push anyway.
      domino_test_turn_ratio: 0.0
      domino_train_turn_ratio: 0.0
  # Place a block so the WIND carries it into a goal region. Not a
  # cascade: one block, one gust, one patch. The robot picks the block
  # up, puts it down upwind of the patch, and declares finished.
  #
  # This is the env where the wind's strength is actually learnable.
  # In domino_fan the wind tips a standing block in ~2 steps, so every
  # force above threshold looks identical and wind_force cannot be
  # fitted. Here the wind pushes through the centre of mass, the block
  # slides, and distance travelled is steep and monotone in the force
  # (1.8 N -> 5.8 cm, 2.5 -> 11.5, 3.2 -> 19.3). Against a 4 cm goal
  # half-width the robot must know the force to about a sixth.
  domino_blow:
    NAME: "pybullet_domino_blow"
    SKIP: True  # un-skipped by run_rung.sh --blow
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      fan_known_controls_relation: True
      fan_fans_blow_opposite_direction: False
      # Lay each chain along one fan's wind axis. Without this the
      # generator points chains anywhere, and a chain across the wind
      # cannot cascade however hard the fan blows - the task is
      # unsolvable before a planner sees it.
      # Sized so the block moves before Wait declares the scene settled
      # (onset 7 steps at 1.5 N against Wait's ~11), not just to clear
      # the 0.123 N tipping threshold. See settings.py.
      # Exactly one block. Spare bodies are not harmless scenery here:
      # they stay MovableBlock wherever they are parked, so the planner
      # grounds PickBlock over them and builds skeletons that reach for
      # a block ten metres off the table, which then cannot be refined.
      domino_train_num_dominos: [1]
      domino_test_num_dominos: [1]
      domino_train_num_targets: [0]
      domino_test_num_targets: [0]
      # Left to settings.py: force and gust length are calibrated
      # together against the measured slide curve, and pinning one of
      # them here silently decoupled the pair - the launcher blew for
      # 60 steps while the oracle's slide model assumed 30, so the
      # block sailed past the goal every time.
      # Straight chains only. Alignment guarantees the FIRST leg runs
      # downwind; a turn puts the rest of the chain across the wind,
      # and the turn geometry was tuned for a robot push anyway.
      domino_train_turn_ratio: 0.0
  # The blow task on the REAL bench: domino_blow's task, scene and trigger
  # replaced. The fan, the button and the goal patch are where the cameras
  # saw them (a scene JSON from BabyRobotPredicator's
  # real_skills/fan_scene_export.py), the block is the real 0.15 m domino,
  # and the fan is started by pressing a momentary arcade button from above
  # and HOLDING it -- the hold is the gust. Parked here; un-skipped by
  # exp_domino_blow_real.yaml, which also decides whether the arm moves.
  # The env builds one task from the scene, so DO NOT set
  # domino_{train,test}_num_dominos here.
  domino_blow_real:
    NAME: "pybullet_domino_blow_real"
    SKIP: True
    ARGS:
      - "make_test_images"
      - "make_failure_images"
    FLAGS:
      num_test_tasks: 1
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      fan_known_controls_relation: True
      fan_fans_blow_opposite_direction: False
      option_model_use_gui: False
      agent_bilevel_log_state: False
      agent_sim_learn_oracle_sim_program: False
      agent_sim_learn_oracle_sim_params: False
      # -- the bench --
      pybullet_robot: "panda"
      domino_use_skill_factories: True
      # The exported fan-bench scene: one block plus fixtures. Re-export
      # after the fan, button or goal marker is moved.
      domino_real_scene: "/home/amberli/babyrobot/BabyRobotPredicator/scenes/fan_bench_20260912.json"
      # Rest the closed fingers at the 0.029 m real domino's faces.
      pybullet_closed_fingers: 0.015
      # How long the button is held: the gust, in seconds, on the arm.
      domino_blow_real_hold_s: 4.0
      # Wind force and gust length are calibrated together against the
      # slide curve (settings.py); the fit turns a measured slide into
      # the force. Left to settings.py.
      real_robot_execute: False
  # Flags from the boil oracle test; boil has a PO simulator. exp_boil_sweep.yaml.
  boil:
    NAME: "pybullet_boil"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "switch"
      max_num_steps_option_rollout: 100
      horizon: 500
      boil_goal: "simple"
      boil_require_jug_full_to_heatup: True
      script_option_file_name: "boil.txt"
      boil_water_fill_speed: 0.0015
      pybullet_birrt_path_subsample_ratio: 2
      boil_num_jugs_train: [1]
      boil_num_jugs_test: [1]
      boil_num_burner_train: [1]
      boil_num_burner_test: [1]
  fan:
    NAME: "pybullet_fan"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "switch"
      terminate_on_goal_reached: True
      process_planning_heuristic_weight: 10.0
      horizon: 500
      pybullet_birrt_path_subsample_ratio: 2
      process_planning_max_execution_replans: 3 # safety net for learned models
  bridge:
    NAME: "pybullet_bridge"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      horizon: 3000
      # Real episodes take 600-950 steps; 2000 leaves headroom for a 20-25
      # option plan while bounding a looping policy's data.
      max_num_steps_interaction_request: 2000
      # Press 3 N into the support before release (post-release drift 4.5 -> 0.2 mm).
      skill_place_settle_preload_force: 3.0
      process_planning_heuristic_weight: 10.0 # unweighted skeleton search is slow
      # Each Wait ends on the first atom change, so multi-cure tails need a
      # cheap replan-from-current-state.
      process_planning_max_execution_replans: 3
      # Bail out of a Wait that sees no atom change (cure_threshold 25 + ~60
      # steps of cure-start stagger).
      wait_option_max_steps: 120
      # The packed staging grid grazes by 2-3 mm; the default 1 mm margin
      # makes those unrecoverable BiRRT rejections.
      pybullet_birrt_contact_margin: -0.005
      # Kinematic pin of welded assemblies while held (carried bonded beams
      # drift ~9-12 deg unpinned, 0 pinned).
      pybullet_pin_held_weld_assemblies: True
  busyboard:
    NAME: "pybullet_busyboard"
    # Parked by default; exp_busyboard.yaml un-skips it.
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      # A press is ~22 low-level steps and a lamp needs ~48 driven ones
      # to light, so a three-press plan runs past the common 500 cap and
      # every refinement would be rejected on the horizon check.
      horizon: 2000
      # REQUIRED here, for the same reason pybullet_bridge needs it. A
      # lamp's lighting is a delayed effect of a drive condition, so the
      # tick it lands on depends on how many low-level steps the
      # surrounding options happen to take; the symbolic delay places it
      # on one tick and physics may deliver it on the neighbouring one,
      # and the per-step atom check then rejects a plan that reaches the
      # goal. Measured 2026-09-01 on oracle_process_planning over 10 test
      # tasks: 8/10 with the check on, 10/10 with it off, at either
      # candidate delay value.
      sesame_check_expected_atoms: False
      # Every button press that lights nothing is free on this board, so
      # nothing in the goal stops a plan from latching extra buttons. The
      # necessity gate refuses a capture that still reaches the goal with
      # a step removed (run_20260902_152811 pressed three of four buttons
      # for a two-press goal).
      agent_plan_validation_necessity: True
  icerink:
    NAME: "pybullet_icerink"
    # Parked by default; protocol_continual.yaml un-skips it.
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      # A push is ~60 low-level steps and a slide settles within ~40
      # more; a three-push plan plus a wait runs past the common 500 cap.
      horizon: 2000
      # A slide lands on its target a few ticks after the push option
      # ends, so the per-step atom check would reject a plan that
      # reaches the goal (same reason as pybullet_busyboard).
      sesame_check_expected_atoms: False
      pybullet_birrt_path_subsample_ratio: 2
  launcher:
    NAME: "pybullet_launcher"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      horizon: 1500
      # The top block topples a few ticks after the launch option ends.
      sesame_check_expected_atoms: False
      pybullet_birrt_path_subsample_ratio: 2
  magnets:
    NAME: "pybullet_magnets"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      horizon: 1500
      # A pulled piece settles under the tip a few ticks after the move.
      sesame_check_expected_atoms: False
      pybullet_birrt_path_subsample_ratio: 2
  balloons:
    NAME: "pybullet_balloons"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      horizon: 1500
      # The box rises to the band a few ticks after the last tie.
      sesame_check_expected_atoms: False
      pybullet_birrt_path_subsample_ratio: 2
  crane:
    NAME: "pybullet_crane"
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      horizon: 1500
      # The crate settles on the bin some ticks after the pull option ends.
      sesame_check_expected_atoms: False
      pybullet_birrt_path_subsample_ratio: 2
