  # NEW: reach-limited "minimum-blocks" domino tasks for the system-ID
  # experiment. Same base flags as the old config, plus the min-block flags:
  #   - domino_min_block_tasks: start/target pairs bridged near the reach
  #     limit; each task carries a MinBlockReward with budget K* (min blues
  #     to topple at the true friction): topple AND blues used <= K*.
  #   - domino_true_friction: the real env's friction (K* computed at it).
  #   - span_lo/hi + num_blues: task geometry / blue budget. Recalibrate the
  #     span with the reach probe if you change domino_true_friction.
  domino:
    NAME: "pybullet_domino"
    # Skipped in favour of the heavy-block variant below; set SKIP: False
    # (or delete the line) to run the friction min-block tasks again,
    # alongside or instead of it.
    SKIP: True
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: "loc,rot,angle,direction"
      # excluded_predicates is set per-approach: agents.yaml excludes
      # these (test ours); oracle.yaml leaves them in (test oracle).
      horizon: 500
      domino_initialize_at_finished_state: False
      domino_use_domino_blocks_as_target: True
      domino_use_continuous_place: True
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: False
      keep_failed_demos: True
      predicate_invent_invent_derived_predicates: True
      pybullet_birrt_extend_num_interp: 20 # increase this to avoid collisions when placing dominoes
      pybullet_birrt_path_subsample_ratio: 2
      # --- min-block / system-ID experiment ---
      domino_min_block_tasks: True
      # FORWARD (over-reach) condition: planning friction above true, so an
      # uncalibrated planner over-estimates reach, UNDER-builds, and the
      # chain dies short of the target. Primary sysID-learning setting
      domino_true_friction: 0.1
      domino_planning_friction: 0.5
      domino_min_block_span_lo: 0.13
      domino_min_block_span_hi: 0.30
      domino_min_block_num_blues: 4
