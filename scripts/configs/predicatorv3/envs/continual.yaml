# Continual-protocol environment menu. Every entry is parked (SKIP); a
# launcher un-parks the one it runs (see continual_common.yaml). Env FLAGS
# override the approach's and the common ones, so per-domain noise levels
# and level budgets live here. Keys are the env half of the experiment id.
#
# The benchmark settings (Sept 18, 2026) are balloons (composition test
# levels), bridge (four-span test row), boil (two-jug test level), fan
# (maze test level) and domino_high_friction_turn; the other entries are
# the earlier or alternative splits they replaced.
ENVS:
  # Balloons: the main tree's benchmark, composition test levels (every test
  # level composes lifts the
  # agent measured on training racks; the weakest-first release bursts) and
  # the 25-step goal dwell. Round 1 (Sept 16, 2026) ran with dwell 1, which
  # let a swinging box win at a turning point; not comparable.
  balloons:
    NAME: pybullet_balloons
    SKIP: true
    FLAGS:
      max_initial_demos: 0
      horizon: 1500
      sesame_check_expected_atoms: false
      pybullet_birrt_path_subsample_ratio: 2
      balloons_require_jam_decoy: false
      balloons_goal_dwell_steps: 25
      continual_obs_noise_position: 0.01
      continual_obs_noise_orientation: 0.02
      continual_obs_noise_scalar: 0.0
      continual_steps_per_level: 5000
      num_train_tasks: 2
  # Balloons, bundle test levels (Sept 17, 2026): the test rack ties its
  # balloons into bundles of two, one clip per bundle, so no cut is a
  # small trim and the arithmetic answer (the bundle resting in band)
  # bursts on its first-cut overshoot; see the pybullet_balloons module
  # doc. Training racks are the usual singles.
  balloons_bundles:
    NAME: pybullet_balloons
    SKIP: true
    FLAGS:
      max_initial_demos: 0
      horizon: 1500
      sesame_check_expected_atoms: false
      pybullet_birrt_path_subsample_ratio: 2
      balloons_require_jam_decoy: false
      balloons_goal_dwell_steps: 25
      balloons_test_bundle_sizes: [2, 2, 2, 2]
      balloons_max_sampling_attempts: 60
      continual_obs_noise_position: 0.01
      continual_obs_noise_orientation: 0.02
      continual_obs_noise_scalar: 0.0
      continual_steps_per_level: 5000
      num_train_tasks: 2
  # Bridge, three spans on both splits (the Sept 14 comparison setting).
  bridge_three_span:
    NAME: pybullet_bridge
    SKIP: true
    FLAGS: &bridge_three_span_flags
      max_initial_demos: 0
      horizon: 3000
      max_num_steps_interaction_request: 2000
      skill_place_settle_preload_force: 3.0
      process_planning_heuristic_weight: 10.0
      process_planning_max_execution_replans: 3
      wait_option_max_steps: 120
      pybullet_birrt_contact_margin: -0.005
      pybullet_pin_held_weld_assemblies: true
      continual_obs_noise_position: 0.005
      continual_obs_noise_orientation: 0.02
      continual_obs_noise_scalar: 0.0
      continual_steps_per_level: 10000
      num_train_tasks: 1
      bridge_train_span_blocks: 3
      bridge_test_span_blocks: 3
  # Bridge, the benchmark setting: a three-span training row, a four-span
  # test row, with the Sept 16 four-span repairs (rigid grasp, lift-first
  # transit, certificate that waits for the robot to withdraw). Not
  # comparable with the span_transfer_r1 cohort, which ran without the
  # repairs. Opus MB 3/3 at 3852 steps against MF 3/3 at 6134 (Sept 17-18).
  bridge:
    NAME: pybullet_bridge
    SKIP: true
    FLAGS: &bridge_flags
      <<: *bridge_three_span_flags
      bridge_train_span_blocks: 3
      bridge_test_span_blocks: 4
      pybullet_grasp_max_force: 10000.0
      bridge_lift_before_transit: true
      bridge_goal_robot_clearance: 0.01
  # The same setting under the key the Sept 17 span-transfer rounds ran
  # under (their logs live at bridge_span_transfer-<experiment>).
  bridge_span_transfer:
    NAME: pybullet_bridge
    SKIP: true
    FLAGS: *bridge_flags
  # Boil: one jug in training, two jugs on the test level, the 5 cm faucet
  # tolerance (the code default since d3ac34f02, pinned here; the old 10 cm
  # rows were dropped on Sept 17).
  boil:
    NAME: pybullet_boil
    SKIP: true
    FLAGS: &boil_flags
      max_initial_demos: 0
      excluded_objects_in_state_str: switch
      max_num_steps_option_rollout: 100
      horizon: 500
      boil_goal: simple
      boil_require_jug_full_to_heatup: true
      script_option_file_name: boil.txt
      boil_water_fill_speed: 0.0015
      pybullet_birrt_path_subsample_ratio: 2
      boil_num_jugs_train: [1]
      boil_num_jugs_test: [2]
      boil_num_burner_train: [1]
      boil_num_burner_test: [1]
      boil_faucet_align_threshold: 0.05
      continual_obs_noise_position: 0.0125
      continual_obs_noise_orientation: 0.05
      continual_obs_noise_scalar: 0.07
      continual_steps_per_level: 5000
      num_train_tasks: 1
  # Fan: uniform 3 x 3 training positions, a 10 x 9 maze on the test level
  # (the table's Fan (maze) row; fan_uniform below is the plain Fan row).
  fan:
    NAME: pybullet_fan
    SKIP: true
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: switch
      terminate_on_goal_reached: true
      process_planning_heuristic_weight: 10.0
      horizon: 500
      pybullet_birrt_path_subsample_ratio: 2
      process_planning_max_execution_replans: 3
      fan_train_num_pos_x: 3
      fan_train_num_pos_y: 3
      fan_test_num_pos_x: 10
      fan_test_num_pos_y: 9
      fan_train_num_walls_per_task: [1]
      fan_test_num_walls_per_task: [16, 20, 24]
      fan_train_task_generation: uniform
      fan_test_task_generation: maze
      fan_maze_min_segments: 4
      fan_maze_min_path_len: 10
      fan_maze_max_segment_len: 4
      continual_obs_noise_position: 0.005
      continual_obs_noise_orientation: 0.02
      continual_obs_noise_scalar: 0.0
      continual_steps_per_level: 5000
      num_train_tasks: 1
  # Domino: min-block friction tasks with a turn, true friction above the
  # planner's belief.
  domino_high_friction_turn:
    NAME: pybullet_domino
    SKIP: true
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: loc,rot,angle,direction
      horizon: 500
      domino_initialize_at_finished_state: false
      domino_use_domino_blocks_as_target: true
      domino_use_continuous_place: true
      process_planning_heuristic_weight: 2.0
      domino_has_glued_dominos: false
      keep_failed_demos: true
      predicate_invent_invent_derived_predicates: true
      pybullet_birrt_extend_num_interp: 20
      pybullet_birrt_path_subsample_ratio: 2
      domino_min_block_tasks: true
      domino_true_friction: 0.5
      domino_planning_friction: 0.1
      domino_min_block_span_lo: 0.29
      domino_min_block_span_hi: 0.31
      domino_min_block_turn_entry_lo: 0.21
      domino_min_block_turn_entry_hi: 0.24
      domino_min_block_turn_exit_lo: 0.17
      domino_min_block_turn_exit_hi: 0.2
      domino_min_block_num_blues: 4
      domino_block_cost: 0.1
      domino_test_turn_ratio: 1.0
      online_learning_early_stopping_ignore_reward_bar: true
      continual_obs_noise_position: 0.01
      continual_obs_noise_orientation: 0.04
      continual_obs_noise_scalar: 0.0
      continual_steps_per_level: 5000
      num_train_tasks: 1
  # Fan, the original test split: uniform 6 x 6 test positions with two or
  # three walls (the Sept 16 Fan row; those were the runtime defaults then,
  # pinned here because the maze entry above overrides them).
  fan_uniform:
    NAME: pybullet_fan
    SKIP: true
    FLAGS:
      max_initial_demos: 0
      excluded_objects_in_state_str: switch
      terminate_on_goal_reached: true
      process_planning_heuristic_weight: 10.0
      horizon: 500
      pybullet_birrt_path_subsample_ratio: 2
      process_planning_max_execution_replans: 3
      fan_test_num_pos_x: 6
      fan_test_num_pos_y: 6
      fan_test_num_walls_per_task: [2, 3]
      fan_test_task_generation: uniform
      continual_obs_noise_position: 0.005
      continual_obs_noise_orientation: 0.02
      continual_obs_noise_scalar: 0.0
      continual_steps_per_level: 5000
      num_train_tasks: 1
  # Boil, one test jug (Sonnet MB 2/2 in 1240 vs MF 2/2 in 3379 on Sept 16).
  boil_one_jug:
    NAME: pybullet_boil
    SKIP: true
    FLAGS:
      <<: *boil_flags
      boil_num_jugs_test: [1]
  # Balloons, the original Sept 16 pilot setting (the table's Balloons row):
  # chute scene, original task distribution, jam decoy, dwell 1. Its
  # balloons_scene and balloons_task_generation flags come from the
  # continual-comparisons line (frozen worktrees), not the main tree, until
  # that merge lands.
  balloons_original:
    NAME: pybullet_balloons
    SKIP: true
    FLAGS:
      max_initial_demos: 0
      horizon: 1500
      sesame_check_expected_atoms: false
      pybullet_birrt_path_subsample_ratio: 2
      balloons_scene: chute
      balloons_task_generation: original
      balloons_require_jam_decoy: true
      balloons_goal_dwell_steps: 1
      continual_obs_noise_position: 0.01
      continual_obs_noise_orientation: 0.02
      continual_obs_noise_scalar: 0.0
      continual_steps_per_level: 5000
      num_train_tasks: 2
