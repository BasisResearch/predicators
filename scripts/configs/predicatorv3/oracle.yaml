# Thin launcher: run the oracle arm.
# Usage: python scripts/local/launch_simp.py -c predicatorv3/oracle.yaml
# Approach definitions live in approaches/all.yaml; this file only un-skips
# the arm(s) it runs and sets oracle-specific ENVS overrides.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
# Oracle keeps restricted push (target inferred from state). The agent
# configs rely on the codebase default (False) so the LLM can name the
# trigger domino explicitly via Push(robot, domino).
ENVS:
  domino:
    FLAGS:
      domino_restricted_push: True
APPROACHES:
  oracle:
    SKIP: False
