# Separate pilot, not a replacement for the paper's Fan maze results.
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 0
NUM_SEEDS: 2
FLAGS:
  continual_skill_preflight: false
  continual_validation_audit: false
ENVS:
  fan_transfer:
    EXTENDS: fan_maze
    FLAGS:
      fan_exposed_transfer: true
      # Quoted CLI literals replace the inherited lists; YAML lists append.
      fan_train_num_walls_per_task: "[0]"
      fan_test_num_walls_per_task: "[0]"
      fan_test_num_pos_x: 3
      fan_test_num_pos_y: 3
      fan_train_task_generation: uniform
      fan_test_task_generation: uniform
APPROACHES:
  mb_opus_transfer_pilot_r1:
    EXTENDS: mb_opus
  mf_opus_transfer_pilot_r1:
    EXTENDS: mf_opus
