# Bridge learning arms with the held-assembly weld pin (commit
# 1cd3cebd) ON, run CONCURRENTLY with the preload-only generation:
# the env key ``bridge_pin`` gives these runs their own experiment ids
# (bridge_pin-agent_po_predicate_invention_al[/_policy]), so their
# checkpoints/results/logs cannot collide with the live
# ``bridge-...`` arms, and the shared bridge env block stays untouched
# (the previous generation keeps its exact physics across its own
# auto-resumes). The env FLAGS below are a verbatim copy of
# envs/all.yaml's bridge block (including the 3 N place preload) plus
# the pin flag.
# Usage:
#   python scripts/engaging/launch.py -c predicatorv3/exp_bridge_pin.yaml \
#       -p mit_preemptable
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ENVS:
  bridge_pin:
    NAME: "pybullet_bridge"
    SKIP: False
    FLAGS:
      max_initial_demos: 0
      horizon: 3000
      max_num_steps_interaction_request: 1000
      skill_place_settle_preload_force: 3.0
      process_planning_heuristic_weight: 10.0
      process_planning_max_execution_replans: 3
      wait_option_max_steps: 120
      pybullet_birrt_contact_margin: -0.005
      # Kinematic pin of welded assemblies while held (commit
      # 1cd3cebd): carried bonded beams are rigid by construction
      # (probe: 0.00 deg / 0.0 mm vs ~9-12 deg unpinned; seat with
      # pin + preload: legs disturbed ~2 mm / ~3 deg, bonds intact).
      pybullet_pin_held_weld_assemblies: True
APPROACHES:
  agent_po_predicate_invention_al:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      bilevel_plan_without_sim: True # for the demonstrator
      agent_solve_max_attempts: 1
      agent_plan_validation_rule_param_margin: True
      agent_explorer_info_mcmc_steps: 0
    ARGS:
      - auto_resume
  agent_po_predicate_invention_al_policy:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      bilevel_plan_without_sim: True # for the demonstrator
      agent_solve_max_attempts: 1
      agent_explorer_info_mcmc_steps: 0
      agent_plan_validation_rule_param_margin: True
    ARGS:
      - auto_resume
