# Continual-protocol arm menu. Every entry is parked (SKIP); a launcher
# un-parks arms, usually under a round-specific key with EXTENDS (see
# continual_common.yaml). MB arms are gated on a deployable model on the
# test level (continual_require_model_on_test). MF arms switch off the
# model-side machinery so the two differ only in the model.
APPROACHES:
  mb_opus:
    NAME: agent_continual
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
  mb_sonnet:
    NAME: agent_continual
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
      continual_require_model_on_test: true
  mf_opus:
    NAME: agent_continual_model_free
    SKIP: true
    FLAGS: &mf_flags
      agent_sdk_model_name: claude-opus-5
      code_sim_learning_interval_belief: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_rollout_noise_filter: false
      code_sim_learning_carry_posterior: false
      code_sim_learning_fit_evidence: false
      continual_belief_frame: false
      agent_model_repair: false
      agent_planner_use_simulator: false
      continual_uncertainty_decisions: false
  mf_sonnet:
    NAME: agent_continual_model_free
    SKIP: true
    FLAGS:
      <<: *mf_flags
      agent_sdk_model_name: claude-sonnet-5
  # ---- The other six arms of the eight-agent comparison (Sept 12-14
  # noisy sweep, protocol_continual_eight_agent_noisy_sweep.yaml). Their
  # approach classes come from the continual-comparisons line (frozen
  # worktrees, codex branches); they are not on bridge-learning until that
  # merge lands, so these entries only resolve on a runtime that has them.
  # Ids follow the mb_/mf_ pattern: <arm>_<model>.
  # Standalone: the agent writes and owns a program world model, no harness
  # fitting.
  standalone_opus:
    NAME: agent_continual_program_world_model
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  standalone_sonnet:
    NAME: agent_continual_program_world_model
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # Oracle dynamics: the ground-truth simulator stands in for the learned
  # model.
  oracle_dynamics_opus:
    NAME: agent_continual_oracle_dynamics
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  oracle_dynamics_sonnet:
    NAME: agent_continual_oracle_dynamics
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # Oracle scene: the true scene parameters are given, the model is learned.
  oracle_scene_opus:
    NAME: agent_continual_oracle_scene
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  oracle_scene_sonnet:
    NAME: agent_continual_oracle_scene
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # Zero shot: no training level, the test level is played cold.
  zero_shot_opus:
    NAME: agent_continual_zero_shot
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  zero_shot_sonnet:
    NAME: agent_continual_zero_shot
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # No fitting: the MB agent with only its declared parameters, no
  # harness parameter fitting. Gated like the MB arms.
  no_fitting_opus:
    NAME: agent_continual_no_fitting
    SKIP: true
    FLAGS: &no_fitting_flags
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      agent_sim_learn_declared_params_only: true
  no_fitting_sonnet:
    NAME: agent_continual_no_fitting
    SKIP: true
    FLAGS:
      <<: *no_fitting_flags
      agent_sdk_model_name: claude-sonnet-5
  # No uncertainty: the MB agent with every uncertainty-driven decision,
  # margin and information-seeking switch off. Gated like the MB arms.
  no_uncertainty_opus:
    NAME: agent_continual_no_uncertainty
    SKIP: true
    FLAGS: &no_uncertainty_flags
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      continual_uncertainty_decisions: false
      agent_sim_learn_param_uncertainty: false
      agent_plan_validation_rule_param_margin: false
      agent_plan_validation_physics_margin: false
      agent_explorer_info_seeking: false
      agent_explorer_info_seeking_adaptive: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_interval_belief: false
      code_sim_learning_carry_posterior: false
  no_uncertainty_sonnet:
    NAME: agent_continual_no_uncertainty
    SKIP: true
    FLAGS:
      <<: *no_uncertainty_flags
      agent_sdk_model_name: claude-sonnet-5
