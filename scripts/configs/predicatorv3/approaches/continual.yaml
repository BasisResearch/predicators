# Continual-protocol arm menu. Every entry is parked (SKIP); a launcher
# un-parks arms, usually under a round-specific key with EXTENDS (see
# continual_common.yaml). MB arms are gated on a deployable model on the
# test level (continual_require_model_on_test). MF arms switch off the
# model-side machinery so the two differ only in the model. The skill
# preflight (continual_skill_preflight) is off by default since Sept 18,
# 2026; a launcher that wants the Sept 17 Sonnet setting sets it to true.
APPROACHES:
  mb_opus:
    NAME: agent_continual
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
  mb_sonnet:
    NAME: agent_continual
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
      continual_require_model_on_test: true
  # EMPIRIC with what the agentic real-to-sim arm receives (Sept 18,
  # 2026): the engine wrapper, the scene manifest and the URDF and mesh
  # files, plus the twin's own core module where the domain declares one
  # (Fan and Balloons). The domain twin still backs the model.
  mb_scene_package_opus:
    NAME: agent_continual
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      agent_sim_provide_base_sim_source: true
      continual_provide_scene_package: true
  mf_opus:
    NAME: agent_continual_model_free
    SKIP: true
    FLAGS: &mf_flags
      agent_sdk_model_name: claude-opus-5
      code_sim_learning_interval_belief: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_rollout_noise_filter: false
      code_sim_learning_carry_posterior: false
      code_sim_learning_fit_evidence: false
      continual_belief_frame: false
      agent_model_repair: false
      agent_planner_use_simulator: false
      continual_uncertainty_decisions: false
  mf_sonnet:
    NAME: agent_continual_model_free
    SKIP: true
    FLAGS:
      <<: *mf_flags
      agent_sdk_model_name: claude-sonnet-5
  # The direct agent with the scene files the agentic real-to-sim arm
  # builds from (Sept 19, 2026): the engine wrapper, the scene manifest
  # and the URDF and mesh files as read-only references. Its prompt only
  # asks it to solve the levels; nothing asks for a simulator or model.
  mf_scene_package_opus:
    NAME: agent_continual_model_free
    SKIP: true
    FLAGS:
      <<: *mf_flags
      continual_provide_scene_package: true
  # ---- The other six arms of the eight-agent comparison
  # (continual_eight_agent_noisy_sweep.yaml). Their approach classes
  # came over from the continual-comparisons line in the Sept 17 merge
  # (agent_continual_program_approach.py, agent_continual_frozen_approach.py,
  # agent_continual_ablation_approach.py). Ids follow the mb_/mf_
  # pattern: <arm>_<model>.
  # Standalone: the agent writes and owns a program world model, no harness
  # fitting.
  standalone_opus:
    NAME: agent_continual_program_world_model
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  standalone_sonnet:
    NAME: agent_continual_program_world_model
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # Oracle dynamics: the ground-truth simulator stands in for the learned
  # model.
  oracle_dynamics_opus:
    NAME: agent_continual_oracle_dynamics
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  oracle_dynamics_sonnet:
    NAME: agent_continual_oracle_dynamics
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # Scene-only: the exact scene twin with corrected base calibration and
  # no mechanism code, frozen for the run (formerly "oracle scene").
  scene_only_opus:
    NAME: agent_continual_scene_only
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  scene_only_sonnet:
    NAME: agent_continual_scene_only
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # Zero shot: no training level, the test level is played cold.
  zero_shot_opus:
    NAME: agent_continual_zero_shot
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-opus-5
  zero_shot_sonnet:
    NAME: agent_continual_zero_shot
    SKIP: true
    FLAGS:
      agent_sdk_model_name: claude-sonnet-5
  # No fitting: the MB agent with only its declared parameters, no
  # harness parameter fitting (the agent may fit in its own sandbox
  # code). Gated like the MB arms.
  no_fitting_opus:
    NAME: agent_continual_no_fitting
    SKIP: true
    FLAGS: &no_fitting_flags
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      agent_sim_learn_declared_params_only: true
  no_fitting_sonnet:
    NAME: agent_continual_no_fitting
    SKIP: true
    FLAGS:
      <<: *no_fitting_flags
      agent_sdk_model_name: claude-sonnet-5
  # No uncertainty handling: fit raw noisy observations, with no state
  # smoothing, uncertainty margins or information seeking. Gated like MB.
  no_uncertainty_opus:
    NAME: agent_continual_no_uncertainty
    SKIP: true
    FLAGS: &no_uncertainty_flags
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      code_sim_learning_rollout_noise_filter: false
      continual_belief_frame: false
      continual_uncertainty_decisions: false
      agent_sim_learn_param_uncertainty: false
      agent_plan_validation_rule_param_margin: false
      agent_plan_validation_physics_margin: false
      agent_explorer_info_seeking: false
      agent_explorer_info_seeking_adaptive: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_interval_belief: false
      code_sim_learning_carry_posterior: false
      # Nothing about the observation noise is declared to this arm: no
      # noise section, no [noise] line, and the harness fit models none
      # of it (Sept 18, 2026).
      continual_obs_noise_declared: false
  no_uncertainty_sonnet:
    NAME: agent_continual_no_uncertainty
    SKIP: true
    FLAGS:
      <<: *no_uncertainty_flags
      agent_sdk_model_name: claude-sonnet-5
  # Agentic real-to-sim baseline (Sept 18, 2026): no domain twin. The
  # agent gets the generic PyBulletEnv, a domain-agnostic SceneBase, the
  # scene manifest and the asset files, and builds its own simulator;
  # the harness fits nothing and runs no uncertainty machinery. Gated
  # like the MB arms. Runs with the same skill library as the other
  # arms (composite by default); set skill_library: primitive for the
  # robot-stack variant.
  real_to_sim_opus:
    NAME: agent_continual_real_to_sim
    SKIP: true
    FLAGS: &real_to_sim_flags
      agent_sdk_model_name: claude-opus-5
      continual_require_model_on_test: true
      agent_sim_learn_declared_params_only: true
      continual_uncertainty_decisions: false
      agent_sim_learn_param_uncertainty: false
      agent_plan_validation_rule_param_margin: false
      agent_plan_validation_physics_margin: false
      agent_explorer_info_seeking: false
      agent_explorer_info_seeking_adaptive: false
      agent_explorer_info_seeking_noise_aware: false
      code_sim_learning_interval_belief: false
      code_sim_learning_carry_posterior: false
  real_to_sim_sonnet:
    NAME: agent_continual_real_to_sim
    SKIP: true
    FLAGS:
      <<: *real_to_sim_flags
      agent_sdk_model_name: claude-sonnet-5
