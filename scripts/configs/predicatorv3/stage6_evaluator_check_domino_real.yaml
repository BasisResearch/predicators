# Does the cascade certificate accept a real-shaped episode? A desk check,
# with no arm and no cameras.
#
# Usage: PYTHONHASHSEED=0 python scripts/local/launch_simp.py \
#            -c predicatorv3/stage6_evaluator_check_domino_real.yaml
#
# The rehearsal next door tests the LOOP and deliberately keeps perception
# in the picture. That is exactly what stops it answering this question:
# scene_file perception replays the static capture, so the twin is
# corrected back to the un-placed layout after every Place, the bridge
# vanishes before the Push, and nothing ever topples. DominoEvaluator's
# counterfactual push probe only runs on goal-reaching episodes, so the
# layer that decides the success bonus is never reached.
#
# Here perception is off entirely and no look is taken, so the twin keeps
# what the plan built and physics runs the cascade. If the target topples,
# the probe runs and we learn whether it certifies -- which is the one
# thing standing between the evaluator and a hardware session.
#
# What this does NOT test: perception, twin correction, the boundary
# looks, or anything the loop does. That is the rehearsal's job.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
FLAGS:
  # One episode answers it; the question is about scoring, not learning.
  num_online_learning_cycles: 1
  online_nsrt_learning_requests_per_cycle: 1
  wait_option_max_steps: 200
NUM_SEEDS: 1
ENVS:
  domino_real:
    SKIP: False
    FLAGS:
      excluded_predicates: "InitialBlock,MovableBlock,Tilting,Upright,InFront"
      # The executor stays attached, so the episode is shaped like a real
      # one -- chunked at option boundaries -- but dry, so nothing moves.
      real_robot_execute: True
      real_robot_dry: True
      # The two that matter. Blind, and never corrected: the twin has to be
      # left alone for the cascade it simulates to survive to the Push.
      real_robot_perception: "none"
      real_robot_observe_at_option_boundary: False
      real_robot_human_reset: False
APPROACHES:
  agent_po_predicate_invention_al:
    SKIP: False
    FLAGS:
      # A fixed plan, so the episode is the same every time and a verdict
      # is attributable to the certificate rather than to what an explorer
      # happened to try.
      explorer: "fixed_plan"
      fixed_plan_explorer_path: "plans/solve_v2_bridge1.txt"
      skip_initial_test: True
