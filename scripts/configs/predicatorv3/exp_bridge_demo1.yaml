# Standard bridge arms with ONE initial demonstration. The only flag
# change vs the bridge env is max_initial_demos: 1, so the agent starts
# from a demonstrated solve instead of exploring from scratch. Its own
# env key gives these runs distinct experiment ids (bridge_demo1-*), so
# checkpoints/results/logs cannot collide with the bridge-* arms. The
# FLAGS below are otherwise a verbatim copy of envs/all.yaml's bridge
# block (sibling env keys do not inherit; the comments there explain
# each value).
# Usage:
#   python scripts/engaging/launch.py -c predicatorv3/exp_bridge_demo1.yaml \
#       -p mit_preemptable
---
includes:
  - exp_bridge.yaml
ENVS:
  bridge:
    SKIP: True
  bridge_demo1:
    NAME: "pybullet_bridge"
    SKIP: False
    FLAGS:
      max_initial_demos: 1
      horizon: 3000
      max_num_steps_interaction_request: 3000
      skill_place_settle_preload_force: 3.0
      process_planning_heuristic_weight: 10.0
      process_planning_max_execution_replans: 3
      wait_option_max_steps: 120
      pybullet_birrt_contact_margin: -0.005
      pybullet_pin_held_weld_assemblies: True
