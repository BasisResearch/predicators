# Relaunch of the tier-1 A3 bridge run whose sandbox git init timed out; 1 seed, 1 test task.
# Usage: python scripts/engaging/launch.py -c predicatorv3/exp_tier1_relaunch_a3_bridge.yaml --partition mit_preemptable
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ENVS:
  bridge:
    SKIP: False
APPROACHES:
  sim_predicator_undirected_explore:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      skip_test_until_last_ite_or_early_stopping: True
    ARGS:
      - auto_resume
