# Thin launcher: run the bridge experiment.
# Usage: python scripts/local/launch_simp.py -c predicatorv3/exp_bridge.yaml --parallel
# Env definitions live in envs/all.yaml and approach definitions in
# approaches/all.yaml (all parked by default); this file only un-skips the
# env + arm(s) it runs. To run a baseline sweep, flip additional arms'
# SKIP to False here.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ENVS:
  bridge:
    SKIP: False
APPROACHES:
  # Regression check PASSED 2026-08-24 (job 21143332 solved 1/1 in 22
  # min after the Place post-release verification revert); re-skipped.
  agent_oracle_hybrid_sim:
    SKIP: True
  sim_predicator:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      bilevel_plan_without_sim: True # for the demonstrator
      agent_solve_max_attempts: 1
      # Early stopping stays train-driven (common.yaml): test tasks are
      # evaluation-only and must never feed a training/termination
      # decision. The path to firing the 2/2 train criterion is making
      # attempts reliable (max-margin plans, precise skills), not
      # peeking at test outcomes.
      # A submission must also survive the calibrated posterior members
      # of the learned rule constants: three straight test failures
      # (cycles 5-7) came from plans centered on marginal operating
      # points (a glue dab at 16 mm of the true 20 mm radius) that
      # passed 5/5 nominal validation rollouts.
      agent_plan_validation_rule_param_margin: True
      # Skip the once-per-cycle exploration-posterior emcee fit (up to 5h
      # wall per cycle at bridge scale for a ~0.1% log-prob gain over the
      # LM warm start). The info-seeking ensemble falls back to a Laplace
      # draw from the solver fit's jacobian; gate/threshold params with a
      # flat likelihood get prior-width spread, degrading gracefully.
      agent_explorer_info_mcmc_steps: 0
      # Fork-parallel validation/margin/probe rollouts - the one config
      # difference the bridge_v2 generation tested (2026-08-26/27):
      # E2E-validated by the oracle regression (job 21336925, 1/1) and
      # live in the v2 learning arms; benchmark 3.74x at 4 workers
      # (job 21336169). Sized to the launcher's --cpus-per-task=8.
      agent_validation_parallel_workers: 6
    # Self-resume from the latest per-cycle checkpoint on requeue /
    # resubmission of the identical command (12h mit_normal cap; or run
    # on mit_preemptable via PREDICATORS_ENGAGING_PARTITION).
    # (store_true arg, so it lives in ARGS, not FLAGS.)
    ARGS:
      - auto_resume
  # Closed-loop policy-mode arm (same learner; the solve deliverable is
  # a per-task policy.py executed without an LLM at test time).
  sim_predicator_policy:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      bilevel_plan_without_sim: True # for the demonstrator
      agent_solve_max_attempts: 1
      agent_explorer_info_mcmc_steps: 0 # see the arm above
      agent_plan_validation_rule_param_margin: True # see the arm above
      agent_validation_parallel_workers: 6 # see the arm above
    ARGS:
      - auto_resume
