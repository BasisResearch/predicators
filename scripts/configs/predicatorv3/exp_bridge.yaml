# Bridge launcher: un-skips the bridge env and the OURS arm(s).
# Usage: python scripts/local/launch_simp.py -c predicatorv3/exp_bridge.yaml --parallel
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
# Seed-3 rerun on the stall fix 621190a1b; prior checkpoints parked in
# saved_approaches/backup_pre_stallfix_relaunch_20260902/ so auto_resume starts fresh.
ENVS:
  bridge:
    SKIP: False
APPROACHES:
  agent_oracle_hybrid_sim:
    SKIP: True # regression passed 2026-08-24 (1/1)
  sim_predicator:
    SKIP: False
    FLAGS:
      skip_initial_test: True
    ARGS:
      - auto_resume # resume the latest per-cycle checkpoint on requeue
  # Same learner; the solve deliverable is a per-task closed-loop policy.py.
  sim_predicator_policy:
    SKIP: True # plan arm only for the seed-3 rerun
    FLAGS:
      skip_initial_test: True
    ARGS:
      - auto_resume
