# Thin launcher: run the bridge experiment.
# Usage: python scripts/local/launch_simp.py -c predicatorv3/exp_bridge.yaml --parallel
# Env definitions live in envs/all.yaml and approach definitions in
# approaches/all.yaml (all parked by default); this file only un-skips the
# env + arm(s) it runs. To run a baseline sweep, flip additional arms'
# SKIP to False here.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ENVS:
  bridge:
    SKIP: False
APPROACHES:
  agent_oracle_hybrid_sim:
    SKIP: True
  agent_po_predicate_invention_al:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      bilevel_plan_without_sim: True # for the demonstrator
      agent_solve_max_attempts: 1
