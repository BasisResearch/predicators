# MCMC-removal check (nomcmc): the adaptive info-seeking arm with the
# ensemble-calibration MCMC turned OFF (agent_explorer_info_mcmc_steps:
# 0). This forces _select_param_ensemble off the posterior-subsample
# path onto the Laplace covariance (or uniform-perturb fallback), so no
# MCMC runs anywhere - the deployed fit is already MCMC-free
# (code_sim_learning_num_mcmc_steps: 0). Balloons only: its burst-band
# parameter is the flat-likelihood case Laplace covers worst, so it is
# the decisive test. If the balloons test level is still won here, the
# margin gate does not need MCMC and all MCMC machinery can be removed.
# Run dir + logs in the main tree so the viewer sees it.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ARGS:
  - auto_resume
FLAGS:
  experiment_protocol: "continual"
  continual_levels: "train_then_test"
  continual_steps_per_level: 5000
  continual_wall_clock_hours: 48.0
  continual_render: True
  continual_make_video: True
  test_fresh_env_per_episode: True
  continual_runs_dir: "/home/ycliang/predicators/logs"
  log: "/home/ycliang/predicators/logs/"
ENVS:
  boil:
    SKIP: True
  balloons:
    SKIP: False
    FLAGS:
      num_train_tasks: 2
APPROACHES:
  oracle:
    SKIP: True
  agent_continual_nomcmc:
    NAME: "agent_continual"
    SKIP: False
    FLAGS:
      agent_sdk_use_local_sandbox: True
      partially_observable: True
      agent_sdk_max_agent_turns_per_iteration: 10000
      agent_sdk_image_max_px: 900
      agent_bilevel_use_llm_initial_params: True
      agent_solve_use_journal: True
      agent_validation_parallel_workers: 6
      code_sim_learning_rollout_min_posterior_width: 0.1
      continual_max_idle_rounds: 5
      agent_plan_validation_rule_param_margin: True
      agent_explorer_info_seeking: True
      agent_explorer_info_seeking_adaptive: True
      # The variable under test: no ensemble-calibration MCMC. The
      # ensemble falls back to the Laplace covariance at the MAP.
      agent_explorer_info_mcmc_steps: 0
