# Balloons bundle levels, round 1 (Sept 17, 2026): Sonnet MB (gated)
# against Sonnet MF on test racks whose balloons are tied into bundles of
# two (envs/continual.yaml: balloons_bundles). One cut frees a whole
# bundle, so there is no small trim; the bundle whose rest height is in
# the band bursts on its first-cut overshoot, and the winning order is
# found by rolling the ascent forward. Training racks are singles.
# python scripts/engaging/launch.py -c predicatorv3/continual_balloons_bundles_r1.yaml --partition mit_preemptable --accounts b,c
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
ENVS:
  balloons_bundles:
    SKIP: false
APPROACHES:
  mb_sonnet_bundles_r1:
    EXTENDS: mb_sonnet
  mf_sonnet_bundles_r1:
    EXTENDS: mf_sonnet
