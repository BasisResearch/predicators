# bridge_v2 generation with ONE initial demonstration (launched
# 2026-08-27). Same v2 stack as exp_bridge_v2.yaml; the only change is
# max_initial_demos: 1, so the agent starts from a demonstrated solve
# instead of exploring from scratch. Its own env key gives these runs
# distinct experiment ids (bridge_v2_demo1-*), so checkpoints/logs
# cannot collide with the running bridge_v2-* arms.
# Usage:
#   python scripts/engaging/launch.py -c predicatorv3/exp_bridge_v2_demo1.yaml \
#       -p mit_preemptable
---
includes:
  - exp_bridge_v2.yaml
ENVS:
  bridge_v2:
    SKIP: True
  bridge_v2_demo1:
    NAME: "pybullet_bridge"
    SKIP: False
    FLAGS:
      max_initial_demos: 1
      horizon: 3000
      max_num_steps_interaction_request: 1000
      skill_place_settle_preload_force: 3.0
      process_planning_heuristic_weight: 10.0
      process_planning_max_execution_replans: 3
      wait_option_max_steps: 120
      pybullet_birrt_contact_margin: -0.005
      pybullet_pin_held_weld_assemblies: True
