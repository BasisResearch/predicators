# Seed-1 replication of the standard bridge arms. Thin wrapper:
# inherits both arms verbatim from exp_bridge.yaml and only moves the
# seed window, so each Slurm job stays one arm x one seed (the TIMEOUT
# auto-relaunch resubmits per job and must never duplicate a sibling
# seed that is still running).
# Usage:
#   python scripts/engaging/launch.py -c predicatorv3/exp_bridge_seed1.yaml \
#       -p mit_preemptable
---
includes:
  - exp_bridge.yaml
START_SEED: 1
NUM_SEEDS: 1
