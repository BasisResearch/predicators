# EMPIRIC rerun on the benchmark runtime (Sept 18, 2026), with what the
# agentic real-to-sim arm receives: the engine wrapper, the scene
# manifest and the asset files, plus the twin's core module on Fan and
# Balloons (mb_scene_package_opus). Opus, three seeds each: 5 domains x
# 3 seeds = 15 runs, on the same menus as the other benchmark arms, so
# the logs land under
# logs/agent_continual/<env>-mb_scene_package_opus_benchmark_r1/seed<N>.
#
# python scripts/engaging/launch.py -c predicatorv3/continual_empiric_scene_package_benchmark_r1.yaml --partition mit_preemptable,mit_normal --requeue --accounts b,d
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 0
NUM_SEEDS: 3
ENVS:
  balloons:
    SKIP: false
  bridge:
    SKIP: false
  boil:
    SKIP: false
  fan:
    SKIP: false
  domino_high_friction_turn:
    SKIP: false
APPROACHES:
  mb_scene_package_opus_benchmark_r1:
    EXTENDS: mb_scene_package_opus
