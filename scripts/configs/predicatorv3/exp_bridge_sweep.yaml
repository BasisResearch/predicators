# BRIDGE sweep over every paper arm (C7 dropped), 5 seeds each.
# Usage: python scripts/engaging/launch.py -c predicatorv3/exp_bridge_sweep.yaml
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
NUM_SEEDS: 5
ENVS:
  bridge:
    SKIP: False
APPROACHES:
# Learning arms skip the pre-loop test; U1 and A1 (no cycles) are evaluated by it.
# The shared block is exp_bridge.yaml's; the rule-param margin is added per arm
# because A4 and A5 must not receive it.
  # C1
  sim_predicator:
    SKIP: False
    FLAGS:
      <<: &bridge_agent_flags
        bilevel_plan_without_sim: True
        agent_solve_max_attempts: 1
        agent_explorer_info_mcmc_steps: 0
        agent_validation_parallel_workers: 6
      skip_initial_test: True
      agent_plan_validation_rule_param_margin: True
    ARGS: &bridge_agent_args
      - auto_resume
  # C1 in policy mode (parked; the paper's C1 is plan mode).
  sim_predicator_policy:
    SKIP: True
    FLAGS:
      <<: *bridge_agent_flags
      skip_initial_test: True
      agent_plan_validation_rule_param_margin: True
    ARGS: *bridge_agent_args
  # C2 (same per-attempt solve budget as C1)
  agent_model_free_planning:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      bilevel_plan_without_sim: True
      agent_solve_max_attempts: 1
      agent_solve_attempt_wall_clock: 2700
      agent_sdk_max_agent_turns_per_iteration: 200
      agent_sdk_image_max_px: 900
    ARGS: *bridge_agent_args
  # C3
  nl_world_model:
    SKIP: False
    FLAGS:
      skip_initial_test: True
      bilevel_plan_without_sim: True
      agent_solve_max_attempts: 1
    ARGS: *bridge_agent_args
  # C4
  code_world_model:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      skip_initial_test: True
    ARGS: *bridge_agent_args
  # C5
  gnn_dynamics:
    SKIP: False
    FLAGS:
      skip_initial_test: True
  # C6
  operator_learning:
    SKIP: False
    FLAGS:
      skip_initial_test: True
  # C8 (same interaction budget as the agent arms)
  maple_q:
    SKIP: False
    FLAGS:
      skip_initial_test: True
  # U1 (PO and open-loop, like C1)
  agent_oracle_hybrid_sim:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      partially_observable: True
      agent_bilevel_max_execution_replans: 0
    ARGS: *bridge_agent_args
  # A1
  sim_predicator_zero_shot:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      agent_plan_validation_rule_param_margin: True
    ARGS: *bridge_agent_args
  # A2
  sim_predicator_undirected_explore:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      skip_initial_test: True
      agent_plan_validation_rule_param_margin: True
    ARGS: *bridge_agent_args
  # A3 (the rule-param margin samples the declared intervals here)
  sim_predicator_no_param_fit:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      skip_initial_test: True
      agent_plan_validation_rule_param_margin: True
    ARGS: *bridge_agent_args
  # A4
  sim_predicator_no_validation:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      skip_initial_test: True
    ARGS: *bridge_agent_args
  # A5
  sim_predicator_no_uncertainty:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      skip_initial_test: True
    ARGS: *bridge_agent_args
  # A6
  sim_predicator_no_predicates:
    SKIP: False
    FLAGS:
      <<: *bridge_agent_flags
      skip_initial_test: True
      agent_plan_validation_rule_param_margin: True
    ARGS: *bridge_agent_args
