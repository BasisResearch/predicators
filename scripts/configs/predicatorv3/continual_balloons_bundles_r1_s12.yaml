# Seeds 1 and 2 of the Balloons bundle levels for all four arms (Sept 17,
# 2026): the Sonnet pair of continual_balloons_bundles_r1.yaml and the Opus
# pair of continual_balloons_bundles_r1_opus.yaml, same experiment ids so the
# seeds join seed 0. Launched from the main tree.
# python scripts/engaging/launch.py -c predicatorv3/continual_balloons_bundles_r1_s12.yaml --partition mit_preemptable,mit_normal --requeue --accounts b,c
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 1
NUM_SEEDS: 2
ENVS:
  balloons_bundles:
    SKIP: false
APPROACHES:
  mb_sonnet_bundles_r1:
    EXTENDS: mb_sonnet
  mf_sonnet_bundles_r1:
    EXTENDS: mf_sonnet
  mb_opus_bundles_r1:
    EXTENDS: mb_opus
  mf_opus_bundles_r1:
    EXTENDS: mf_opus
