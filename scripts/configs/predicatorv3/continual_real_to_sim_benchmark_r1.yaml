# Agentic real-to-sim baseline on the five benchmark settings (Sept 18,
# 2026): the agent builds its own PyBullet scene from the engine, the
# scene manifest and the asset files (agent_continual_real_to_sim), on
# Opus, three seeds each: 5 domains x 3 seeds = 15 runs. Envs and the
# arm come from the menus (envs/continual.yaml, approaches/continual.yaml);
# the round key follows the eight-agent sweep, so the logs land under
# logs/agent_continual_real_to_sim/<env>-real_to_sim_opus_benchmark_r1/seed<N>.
#
# python scripts/engaging/launch.py -c predicatorv3/continual_real_to_sim_benchmark_r1.yaml --partition mit_preemptable,mit_normal --requeue --accounts a,b,c,d
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 0
NUM_SEEDS: 3
ENVS:
  balloons:
    SKIP: false
  bridge:
    SKIP: false
  boil:
    SKIP: false
  fan:
    SKIP: false
  domino_high_friction_turn:
    SKIP: false
APPROACHES:
  real_to_sim_opus_benchmark_r1:
    EXTENDS: real_to_sim_opus
