# Stage 6 with the REVERSE (under-reach) friction mismatch, on the real
# Franka. THE ARM MOVES, the cameras are live, and a human rearranges the
# scene between episodes.
#
# Usage: PYTHONHASHSEED=0 python scripts/local/launch_simp.py \
#            -c predicatorv3/stage6_domino_real_underreach.yaml
#
# stage6_domino_real.yaml, plus one belief: the planner thinks the dominoes
# are far more slippery than they are, so it UNDER-estimates how far a chain
# reaches, OVER-builds, and pays the per-block cost for blues it did not
# need. That is domino_high_friction's condition -- and it is the one of the
# two that transfers honestly to hardware, because it only lowers what the
# PLANNER believes and leaves the world alone.
#
# Its mirror does not transfer. domino_low_friction lowers
# domino_true_friction, which on a generated env IS the ground truth but here
# is only the twin: it would make the twin predict a slippery cascade that
# perception corrects away at the next look, while the real dominoes carry on
# at whatever the table actually does. To make the planner OVER-reach here
# you would raise domino_planning_friction above the table instead.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
FLAGS:
  # Two cycles, not one: early stopping is gated on the model having learned
  # (main.py's model_has_learned), so a cycle-0 success can never short it.
  num_online_learning_cycles: 2
  # Wait ends on an atom change or on the scene settling. If a push topples
  # nothing and the twin keeps jittering above the quiescence eps, neither
  # happens and Wait runs to the horizon -- the shipped bound is `inf`, so
  # there is nothing else to stop it. This caps the damage at one option.
  wait_option_max_steps: 200
NUM_SEEDS: 1
ENVS:
  domino_real:
    SKIP: False
    FLAGS:
      excluded_predicates: "InitialBlock,MovableBlock,Tilting,Upright,InFront"
      # -- the one flag that makes this real ---------------------------------
      real_robot_execute: True
      real_robot_human_reset: True
      # -- the mismatch ------------------------------------------------------
      # Applied only to sims built with skip_process_dynamics=True (the
      # approach's base env and option models), so the twin keeps the
      # settings.py default 0.5 and goes on modelling the real table.
      domino_planning_friction: 0.1
      # Measured on the real scene in Stage 2, not a guess.
      real_robot_divergence_atol: 0.02
      # A run this long should leave evidence: one JSON per look, recording
      # what the cameras saw beside what the twin predicted.
      real_robot_observation_dump_dir: "logs/stage6_underreach_looks"
APPROACHES:
  agent_po_predicate_invention_al_margin:
    SKIP: False
    FLAGS:
      skip_initial_test: True
