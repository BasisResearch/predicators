# Scene-only ablation on the five benchmark settings (Sept 18, 2026):
# the exact scene twin with corrected base calibration, no mechanism
# code, frozen for the run (agent_continual_scene_only, formerly
# "oracle scene"), on Opus, three seeds each: 5 domains x 3 seeds = 15
# runs. Envs and the arm come from the menus (envs/continual.yaml,
# approaches/continual.yaml); the round key matches the eight-agent
# sweep so the logs land under logs/agent_continual_scene_only/
# <env>-scene_only_opus_benchmark_r1/seed<N> either way.
#
# python scripts/engaging/launch.py -c predicatorv3/continual_scene_only_benchmark_r1.yaml --partition mit_preemptable,mit_normal --requeue --accounts c,d
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 0
NUM_SEEDS: 3
ENVS:
  balloons:
    SKIP: false
  bridge:
    SKIP: false
  boil:
    SKIP: false
  fan:
    SKIP: false
  domino_high_friction_turn:
    SKIP: false
APPROACHES:
  scene_only_opus_benchmark_r1:
    EXTENDS: scene_only_opus
