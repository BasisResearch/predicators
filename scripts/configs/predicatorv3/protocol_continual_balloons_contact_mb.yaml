# Contact-only chute balloons, MODEL-BASED (adaptive uncertainty) arm,
# seeds 0-2. Each test level has two balloon sets that hang the box at the
# SAME height inside the band; the one a rest-height reader is drawn to
# (nearest band centre) wedges in the chute and fails, while the unique
# safe set sits off-centre. Height and net lift give no signal - only a
# contact rollout (sim.run) tells the safe set from the jamming decoy. So
# the model-based arm re-checks feasibility in its head for free, while the
# model-free arm has no simulator and must trial-and-error (real steps,
# resets, or an irreversible burst). This sidesteps the sim.fit height
# fragility (height no longer decides), landing the discriminator in the
# jam prediction the belief sim already tracks exactly.
---
START_SEED: 0
NUM_SEEDS: 3
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ARGS:
  - auto_resume
FLAGS:
  experiment_protocol: "continual"
  continual_levels: "train_then_test"
  continual_steps_per_level: 5000
  continual_wall_clock_hours: 48.0
  continual_render: True
  continual_make_video: True
  test_fresh_env_per_episode: True
  continual_runs_dir: "/home/ycliang/predicators/logs"
  log: "/home/ycliang/predicators/logs/"
ENVS:
  boil:
    SKIP: True
  balloons:
    SKIP: False
    FLAGS:
      # Contact-only generation (balloons_require_jam_decoy) is now the env
      # default; only the train-level count is level-set specific here.
      num_train_tasks: 2
APPROACHES:
  oracle:
    SKIP: True
  agent_continual_contact:
    NAME: "agent_continual"
    SKIP: False
    FLAGS:
      agent_sdk_use_local_sandbox: True
      partially_observable: True
      agent_sdk_max_agent_turns_per_iteration: 10000
      agent_sdk_image_max_px: 900
      agent_bilevel_use_llm_initial_params: True
      agent_solve_use_journal: True
      agent_validation_parallel_workers: 6
      code_sim_learning_rollout_min_posterior_width: 0.1
      continual_max_idle_rounds: 5
      agent_plan_validation_rule_param_margin: True
      agent_explorer_info_seeking: True
      agent_explorer_info_seeking_adaptive: True
