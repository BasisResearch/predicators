# The five remaining comparison arms of the eight-agent benchmark sweep
# (Sept 18, 2026), launched after the scene-only round: standalone
# program world model, oracle dynamics, zero shot, no harness fitting,
# no explicit uncertainty, all on Opus, on the five benchmark settings,
# three seeds each: 5 arms x 5 domains x 3 seeds = 75 runs. Envs and
# arms come from the menus (envs/continual.yaml, approaches/
# continual.yaml); the round keys match the eight-agent sweep
# (continual_eight_agent_noisy_sweep.yaml), so the logs land under
# logs/<approach>/<env>-<arm>_opus_benchmark_r1/seed<N> either way.
# The Opus MB, MF and scene-only rounds ran earlier under the same keys.
#
# Launched from a frozen worktree so later edits to the main tree do not
# reach running or requeued jobs:
# python scripts/engaging/launch.py -c predicatorv3/continual_five_ablations_benchmark_r1.yaml --partition mit_preemptable,mit_normal --requeue --accounts a,b,c,d
includes:
  - continual_common.yaml
  - envs/continual.yaml
  - approaches/continual.yaml
START_SEED: 0
NUM_SEEDS: 3
ENVS:
  balloons:
    SKIP: false
  bridge:
    SKIP: false
  boil:
    SKIP: false
  fan:
    SKIP: false
  domino_high_friction_turn:
    SKIP: false
APPROACHES:
  standalone_opus_benchmark_r1:
    EXTENDS: standalone_opus
  oracle_dynamics_opus_benchmark_r1:
    EXTENDS: oracle_dynamics_opus
  zero_shot_opus_benchmark_r1:
    EXTENDS: zero_shot_opus
  no_fitting_opus_benchmark_r1:
    EXTENDS: no_fitting_opus
  no_uncertainty_opus_benchmark_r1:
    EXTENDS: no_uncertainty_opus
