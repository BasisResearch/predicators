# Contact-only chute balloons, MODEL-FREE baseline arm, seeds 0-2. Paired
# one-flag-clean with the contact-only model-based config. Each test level
# has two balloon sets that hang the box at the SAME height in the band;
# the height-central one wedges in the chute, the off-centre one is safe.
# The model-free agent has no simulator to check which set threads the
# slot and cannot read the answer off rest height (both sets share it), so
# it must re-discover the safe set by jamming (real steps and resets) or
# gambling into an irreversible burst - it should fall behind the
# model-based arm even though both solved the fixed-geometry chute.
---
START_SEED: 0
NUM_SEEDS: 3
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ARGS:
  - auto_resume
FLAGS:
  experiment_protocol: "continual"
  continual_levels: "train_then_test"
  continual_steps_per_level: 5000
  continual_wall_clock_hours: 48.0
  continual_render: True
  continual_make_video: True
  test_fresh_env_per_episode: True
  continual_runs_dir: "/home/ycliang/predicators/logs"
  log: "/home/ycliang/predicators/logs/"
ENVS:
  boil:
    SKIP: True
  balloons:
    SKIP: False
    FLAGS:
      # Contact-only generation (balloons_require_jam_decoy) is now the env
      # default; only the train-level count is level-set specific here.
      num_train_tasks: 2
APPROACHES:
  oracle:
    SKIP: True
  agent_continual_model_free_contact:
    NAME: "agent_continual_model_free"
    SKIP: False
    FLAGS:
      agent_sdk_use_local_sandbox: True
      partially_observable: True
      agent_planner_use_simulator: False
      agent_solve_use_journal: True
      agent_sdk_max_agent_turns_per_iteration: 10000
      agent_sdk_image_max_px: 900
      continual_max_idle_rounds: 5
