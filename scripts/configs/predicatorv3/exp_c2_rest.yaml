# C2 (model-free planning agent) on the remaining four envs, 1 seed, 1
# test task each, after the boil smoke run (exp_c2_boil.yaml) came back
# clean. Usage: python scripts/engaging/launch.py -c predicatorv3/exp_c2_rest.yaml --partition mit_preemptable
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ENVS:
  domino_high_friction_turn:
    SKIP: False
  fan:
    SKIP: False
  bridge:
    SKIP: False
  busyboard:
    SKIP: False
APPROACHES:
  agent_model_free_planning:
    SKIP: False
    FLAGS:
      skip_initial_test: True
    ARGS:
      - auto_resume
