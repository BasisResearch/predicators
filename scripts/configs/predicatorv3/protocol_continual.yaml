# Continual protocol launcher (docs/continual-protocol.md).
# Usage: python scripts/engaging/launch.py -c predicatorv3/protocol_continual.yaml \
#            --partition mit_preemptable
# One Slurm job per env x arm x seed. Each job plays the env's levels
# (its train tasks, then its test tasks) under the continual protocol and
# writes one run directory, logs/<arm>/<exp>/seed<k>/run_<stamp>/:
# scorecard.json, L<k>/ recordings, agent/, run.mp4 and the logs.
# Env definitions live in envs/all.yaml and arm definitions in
# approaches/all.yaml (all parked); this file un-skips what it runs and
# sets the protocol flags. Flip SKIPs to change the env or arm set.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
ARGS:
  # A requeue (preemption or the wall-time trap) resumes the run in its
  # directory from the scorecard and the level recording (section 6.6).
  - auto_resume
FLAGS:
  experiment_protocol: "continual"
  continual_levels: "train_then_test"
  # Pooled cap: 5000 steps per level for the small envs (4.8). bridge
  # overrides to 10000 below.
  continual_steps_per_level: 5000
  continual_wall_clock_hours: 48.0
  continual_render: True
  # run.mp4 in the run directory at run end (predicators/run/continual_video.py).
  continual_make_video: True
  # Every level is played in the long-lived env; a fresh PyBullet
  # instance per level keeps one level's physics history out of the next.
  test_fresh_env_per_episode: True
ENVS:
  boil:
    SKIP: False
  # The other four envs of the suite, parked; domino_high_friction_turn
  # is the sweeps' domino env. Un-skip to launch (first agent runs
  # 2026-09-04: jobs 21969776-21969779).
  bridge:
    SKIP: True
    FLAGS:
      continual_steps_per_level: 10000
  domino_high_friction_turn:
    SKIP: True
  fan:
    SKIP: True
  busyboard:
    SKIP: True
  # The physics puzzles added 2026-09-05 (docs/envs/<name>/), parked.
  icerink:
    SKIP: True
  launcher:
    SKIP: True
  magnets:
    SKIP: True
  balloons:
    SKIP: True
  crane:
    SKIP: True
APPROACHES:
  oracle:
    SKIP: False
  # The two reference arms of section 6.7. Random primitives are the
  # lower reference; random skills show what the skill library alone buys.
  random_primitives:
    NAME: "random_actions"
    SKIP: True
  random_skills:
    NAME: "random_options"
    SKIP: True
  # The LLM agent arm: C1's learner (hybrid simulator, parameter fit,
  # predicate invention) playing through the protocol's env and skill
  # tools (docs/continual-protocol.md, section 5). Flags mirror the C1
  # arm in approaches/all.yaml minus the phased-loop machinery.
  agent_continual:
    NAME: "agent_continual"
    SKIP: True
    FLAGS:
      agent_sdk_use_local_sandbox: True
      partially_observable: True
      # One conversation per run: a round's turn cap is effectively
      # unbounded; the step cap and the run wall clock are the limits.
      agent_sdk_max_agent_turns_per_iteration: 10000
      agent_sdk_image_max_px: 900
      agent_bilevel_use_llm_initial_params: True
      agent_solve_use_journal: True
      agent_validation_parallel_workers: 6
      code_sim_learning_rollout_min_posterior_width: 0.1
      continual_max_idle_rounds: 5
      # Uncertainty-aware planning: the capture gate re-runs each plan
      # under the calibrated rule-parameter ensemble and refuses a plan
      # that only reaches the goal at the point estimate; info-seeking
      # builds and calibrates that ensemble. Both default off; enabling
      # them here (2026-09-06) after the balloons A/B - with them off the
      # test level was lost to an overshoot burst (reg1), with them on it
      # was won 3/3 (u1).
      agent_plan_validation_rule_param_margin: True
      agent_explorer_info_seeking: True
  # The model-free baseline (section 6.7): the same env and skill tools,
  # sandbox and journal, no belief model, no sim and no learning
  # session. Flags mirror the phased agent_model_free_planning arm; no
  # simulator is built at all.
  agent_continual_model_free:
    NAME: "agent_continual_model_free"
    SKIP: True
    FLAGS:
      agent_sdk_use_local_sandbox: True
      # The same observation as the model-based arm. Without this the
      # baseline saw the bridge's hidden cure_* counters and attached_*
      # slots (seed 0, 2026-09-04) and read the weld law off them.
      partially_observable: True
      agent_planner_use_simulator: False
      agent_solve_use_journal: True
      agent_sdk_max_agent_turns_per_iteration: 10000
      agent_sdk_image_max_px: 900
      continual_max_idle_rounds: 5
