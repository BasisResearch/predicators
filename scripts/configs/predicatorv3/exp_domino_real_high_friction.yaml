# Thin launcher: the domino_high_friction friction-mismatch condition run on
# the real bench's simulated twin (the reconstructed scene), rather than on
# generated min-block tasks.
# Usage:
#   python scripts/local/launch_simp.py -c predicatorv3/exp_domino_real_high_friction.yaml
#
# This is exp_domino_real.yaml (env geometry + scene) plus the friction
# mismatch that exp_domino.yaml's domino_high_friction_turn arm supplies, and
# the margin agent instead of the plain AL agent.
#
# WHAT CARRIES OVER FROM domino_high_friction_turn, AND WHAT DOES NOT.
# The pybullet_domino_real env overrides task generation entirely
# (_generate_train_tasks / _generate_test_tasks both call
# _build_task_from_scene, and _make_domino_component sizes the component from
# the scene JSON's role counts), so only the physics half of that arm applies:
#
#   * CARRIES OVER - domino_true_friction / domino_planning_friction. Applied
#     in PyBulletDominoComposedEnv.__init__, which this env inherits: the eval
#     env runs at the true friction, planning sims (skip_process_dynamics) run
#     at the planning friction. That pair IS the system-ID condition, and it is
#     scene-independent.
#   * DOES NOT APPLY - domino_min_block_tasks, domino_min_block_span_lo/hi,
#     domino_min_block_turn_entry_lo/hi, domino_min_block_turn_exit_lo/hi,
#     domino_min_block_num_blues, domino_test_turn_ratio. All are read by the
#     min-block task generator, which this env never reaches. They are left out
#     rather than set to values that would silently do nothing.
#   * DOES NOT APPLY - domino_block_cost. The per-blue reward cost lives on a
#     DominoEvaluator, and _task_from_perceived builds its EnvironmentTask
#     without one, so reward here is plain goal-reached. Attaching an evaluator
#     to scene-built tasks is a code change, not a config change.
#
# The "turn" half of domino_high_friction_turn is likewise a property of the
# physical layout here, not of a flag: point domino_real_scene at a captured
# turn scene (and set the start/target ids to match) to get that condition.
#
# real_robot_execute stays False (inherited): this runs purely in the twin. No
# RealRobotExecutor is attached and no motion reaches the Franka.
---
includes:
  - common.yaml
  - envs/all.yaml
  - approaches/all.yaml
FLAGS:
  num_online_learning_cycles: 2
NUM_SEEDS: 1
# Agent-only env overrides, deep-merged on top of envs/all.yaml's domino_real
# block (which supplies the bench geometry: panda, table z, real domino dims,
# pedestal decoration, gripper clamp).
ENVS:
  domino_real:
    SKIP: False
    FLAGS:
      # Dropped for "ours" runs; oracle configs would keep them in.
      excluded_predicates: "InitialBlock,MovableBlock,Tilting,Upright,InFront"
      # Pin the scene: the envs/all.yaml default names a capture that is not
      # checked in. Repoint this (with the ids below) to run another scene.
      domino_real_scene: "/home/amberli/babyrobot/BabyRobotPredicator/scenes/domino_straight_easy.json"
      domino_real_start_id: 6
      domino_real_target_id: 5
      # --- the domino_high_friction condition (see the note above) ---
      # Planner believes 0.1, bench runs at 0.5: an uncalibrated planner
      # under-estimates topple reach and OVER-builds. A system-ID learner has
      # to recover the true value from what it sees in the twin.
      domino_true_friction: 0.5
      domino_planning_friction: 0.1
      online_learning_early_stopping_ignore_reward_bar: True
APPROACHES:
  agent_po_predicate_invention_al_margin:
    SKIP: False
