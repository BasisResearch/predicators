  <g id="text_21">
   <text style="fill: #526475; font: 9px 'DejaVu Sans'" transform="translate(77.76 444.886594)">Points = all-seed means. Noiseless: n = 1; noisy: n = 2. Solve rate includes train + test.</text>
   <text style="fill: #526475; font: 9px 'DejaVu Sans'" transform="translate(77.76 458.383922)">MB w/ features has one measured setting. Lines join measured adjacent settings; no extrapolation.</text>
   <text style="fill: #526475; font: 9px 'DejaVu Sans'" transform="translate(77.76 471.88125)">Earlier MB runs use older code. Read step costs alongside solve rate.</text>
   <text style="fill: #526475; font: 9px 'DejaVu Sans'" transform="translate(77.76 485.378578)">Categorical x-axis; small offsets reveal overlapping points. Snapshot: 2026-09-08 13:05 UTC.</text>
