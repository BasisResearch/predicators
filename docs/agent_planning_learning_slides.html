# How the Main Agent Plans and Learns

`agent_po_sim_predicate_invention` (al_margin arm)<br>
env `domino_high_friction_turn`, seed 0/1, `run_20260723_110212`<br>
Focus: the agent's tool surface and the BeliefProbe (`sim`) API
<!-- .element: class="small" -->

Note: This deck explains the main agent end to end using a single real run that went from 0/2 failed explorations to a solved test task in one learning cycle. Everything shown (plans, fit reports, learned code) is taken verbatim from the run's logs.

---

## Big picture: an LLM coding agent inside an online TAMP loop

| **Explore** | **Learn** | **Test** |
|---|---|---|
| Agent plans an interaction episode on a train task; the plan is executed in the **real env**, producing a trajectory (success or failure, both are data). | Agent **writes code**: `simulator.py` (process rules + physics params, fitted to the data) and `predicates.py` (invented predicates). | Agent plans against the **learned BeliefSim**; captured plan is executed on the test task with subgoal monitoring + replanning. |

- The agent is a coding agent in a per-run **sandbox** (Bash, Read/Write/Edit, Glob/Grep + curated MCP tools)
- **BeliefSim** = frozen PyBullet base sim (robot, rigid bodies) **composed with** the agent's learned dynamics: the agent's current belief about how the world works
- Loop repeats up to 10 cycles; **early-stops** when every train attempt in a cycle solves

Note: Three session types, all the same sandbox agent but with different prompts and different tool surfaces. The env's rigid-body physics and skills are given; what is NOT given is any symbolic vocabulary beyond Holding, any process dynamics, and the true physics parameters.

---

## What the agent has, and what it must produce

|  | Given | Must produce |
|---|---|---|
| **Skills** | Typed options with continuous params: `Pick(robot, domino)[grasp_z]`, `Place(robot)[x, y, z, yaw]`, `Push(robot, domino)[approach, contact_z]`, `Wait(robot)` | Full plans: option sequence + object args + **exact continuous parameters** |
| **Predicates** | Only `Holding(robot, domino)` | Everything else, invented in `predicates.py` (placement, topple, process-completion...) |
| **Dynamics** | Base PyBullet sim with possibly **mis-calibrated physics** (built-in friction 0.1) | `simulator.py`: process rules, learnable params, and/or `PHYSICAL_PARAMS` system identification |
| **Goal** | Natural language + black-box checks (`is_goal_state`, task evaluator) | A plan the **env's own evaluator** scores as a legitimate solve |

Partial observability variant: causally-important quantities may be absent from the observation entirely; rules can carry a `latent` dict across steps to model them.
<!-- .element: class="small" -->

Note: Key framing: this is world-model learning, not just planning. The env deliberately runs different physics than the base sim's defaults (high friction 0.5 vs built-in 0.1), so a plan tuned on the uncalibrated sim fails on the real env.

---

## The task in this run

![initial scene](assets/agent_run_20260723/task000_initial_state.png) <!-- .element: style="max-height: 320px; float: left; margin-right: 0.8em;" -->

- **Goal:** arrange blue dominoes so that pushing the **green** domino topples the **purple** one, using as few blues as possible
- Green and purple must stay untouched and upright until the push; only green may ever be pushed
- **Legitimacy check:** the push is replayed with every robot link except the fingertips made intangible; the layout must still cascade
- Reward: +1 for a solve, **-0.1 per blue domino consumed**

High-friction variant: a toppling domino barely slides, so bridge spacing tolerances are tight and the number of blues needed depends on real friction.
<!-- .element: class="small" -->

Note: The counterfactual fingertip replay is our anti-reward-hacking evaluator: arm-assisted topples earn nothing. The agent is told all of this in the goal text.

---

## This run at a glance (seed 1, 62 min wall clock)

| # | Session | What happened | Outcome |
|---|---|---|---|
| 001 | Explore (cycle 0) | Probed push reach, swept bridge positions, captured a 1-blue bridge plan | Real env: reward -0.10, not solved |
| 002 | Explore (cycle 0) | Tested complementary design variations | Real env: reward -0.10, not solved |
| 003 | **Learn** | Diagnosed residuals, wrote `simulator.py` + `predicates.py`, ran sysID | lateral_friction 0.1 → ~0.5, identified; 3 predicates invented |
| 004 | **Test** (cycle 0) | Planned on the calibrated BeliefSim: 3-blue bridge chain | Real env: **solved**, reward 0.70 |
| 005/006 | Explore (cycle 1) | Both train attempts solved with the calibrated model | 2/2 solved → **early stop** (test skipped as redundant) |

- The two cycle-0 failures are the learning signal: plans tuned on friction 0.1 physics under-predict how hard cascades are to propagate
- One learning session fixed the physics; every subsequent attempt solved

Note: Note the pattern: exploration on the uncalibrated sim fails on the real env; the failures become training trajectories; one sysID fit repairs the model; then planning transfers. The early-stopping logic skips the redundant re-test because the model did not change in cycle 1.

---

## Two tool surfaces, one sandbox

|  | Solve / explore sessions (planning) | Synthesis session (learning) |
|---|---|---|
| **Deliverable** | A captured plan (via `evaluate_option_plan`) | `simulator.py` + `predicates.py` |
| **Python REPL tool** | `explore_python`: numpy, real `trajectories`, `describe_trajectory`, and the **BeliefProbe** (`sim`) | `run_python`: same, plus `train_tasks`, `is_goal_state`, `ParamSpec`; `sim` probes the **candidate** `simulator.py` under edit |
| **Extra tools** | `evaluate_option_plan` (the only capture path), `record_journal` | `evaluate_predicate_quality` (scores + hot-reloads predicates) |
| **BeliefProbe surface** | `sim.run / refine / reset / render / state / atoms / task / snapshot` | all of those **plus** `sim.fit` (MAP fit) and `sim.residuals` |

- Both also get the sandbox tools: Bash, Read, Write, Edit, Glob, Grep, python3 scripts, `./reference/` API sources, `./session_logs/` of all past sessions
<!-- .element: class="small" -->

Note: The tool surface is curated per phase. In solve sessions the evaluator can only be consulted through paths that pay for full physics rollouts, so the agent cannot search over state sequences the evaluator likes without simulating them. In synthesis the probe auto-refits the candidate simulator whenever the file changes.

---

## Planning sessions: prompt in, captured plan out

- **Prompt contains:** NL goal, initial-state feature table + rendered scene image, object roster, options digest with per-parameter meaning and bounds, available predicates, tool list
- Typical loop (from session 001): read the scene image → probe physics with `sim` (how far does a bare push carry?) → sweep candidate designs → validate reliability → submit
- **Design-first guidance:** compare qualitatively different designs cheaply before fine-tuning any one; parameter tuning cannot rescue a wrong design
- The **only output that counts** is a plan captured by `evaluate_option_plan`; analysis text is discarded
- Test-time execution then runs the captured plan step by step, checking each step's subgoal atoms against the real state; a diverged step triggers **replanning** (up to 2 replans)

Note: The explore and test prompts are almost identical; explore sessions additionally carry experiment guidance (the al arm asks for sketches whose annotations straddle the learned model's decision boundaries, so each episode doubles as an experiment). Attempts have a 45-min wall clock and a rollout budget shown in a footer after every tool call.

---

## The plan language: options + params + subgoal annotations

The actual captured plan from the test session (solved, reward 0.70):
<!-- .element: class="small" -->

```text
Pick(robot:robot, domino_2:domino)[0.05]        -> {Holding(robot:robot, domino_2:domino)}
Place(robot:robot)[0.687, 1.342, 0.55, 0.0]     -> {UprightAtRest(domino_2:domino)}
Pick(robot:robot, domino_3:domino)[0.05]        -> {Holding(robot:robot, domino_3:domino)}
Place(robot:robot)[0.737, 1.412, 0.55, 0.0]     -> {UprightAtRest(domino_3:domino)}
Pick(robot:robot, domino_4:domino)[0.05]        -> {Holding(robot:robot, domino_4:domino)}
Place(robot:robot)[0.777, 1.482, 0.55, -0.7]    -> {UprightAtRest(domino_4:domino)}
Push(robot:robot, domino_0:domino)[0.06, 0.05]  -> {Toppled(domino_0:domino), Toppled(domino_1:domino)}
```

- One option per line, typed object refs, **exact** continuous params in `[...]`; parser is strict
- `-> {atoms}` annotations are load-bearing: refinement validates each annotated step, and at execution they are checked against the **real** state to detect divergence and replan; `Wait` uses them as its termination condition
- All non-`Holding` atoms here (`UprightAtRest`, `Toppled`) are predicates the agent **invented** in the learn session

![bridge built](assets/agent_run_20260723/iter000_task000_test443_step_5_Place.png) <!-- .element: style="max-height: 150px; margin: 0 0.3em;" --> ![cascade after push](assets/agent_run_20260723/iter000_task000_test443_step_6_Push.png) <!-- .element: style="max-height: 150px; margin: 0 0.3em;" -->

Bridge built (after step 5) → cascade toppled purple (after Push)
<!-- .element: class="small" -->

Note: Note the last Place uses yaw -0.7: the agent learned that a negative yaw offset biases a domino's fall direction laterally, which it needed for the turn onto the purple target. Also note there is no Wait: the agent journaled that Toppled(domino_1) is added during the Push step itself and a bare Wait wastes ~1000 low-level actions.

## `evaluate_option_plan`: the capture gate

Runs the exact plan (no sampling) on the BeliefSim, reports per-step: actions taken, atoms **added / deleted**, failures, and a saved scene image per step. A plan is **captured** only if all gates pass:

1. **Strict parse**: unknown option, wrong arity, or missing params is a hard error, never silently dropped
2. **Goal + evaluator**: rollout must reach the goal atoms *and* the task evaluator must score it `solved=True` (incl. the fingertips-only counterfactual replay)
3. **Multi-rollout validation**: 3 repeats on a **fresh physics env with decorrelated motion-planner seeds** per trial; flaky plans escalate to 6/6
4. **Physics-margin gate** (this arm): the plan is re-rolled under physics perturbed by the sysID posterior's honest width; a plan that only works at the point estimate is rejected

From the run: "Captured as the current answer: 7 steps, 7 with subgoal annotations... Validated 3/3 rollouts... solved=True, reward=0.70... robust to physics-parameter perturbation." Budget footer: 354 sim rollouts, 21.6/45 min.
<!-- .element: class="small" -->

Note: Fresh env + decorrelated seeds matters: with a shared env and constant seed, N trials are bit-identical replays, i.e. one effective sample. The margin gate is the new al_margin treatment: capture requires robustness across the posterior's uncertainty, which also pressures the agent to collect data that shrinks that posterior.

---

## The BeliefProbe API: `sim`

- **BeliefSim** is the learned hybrid sim itself (step-level dynamics); the **BeliefProbe** (`sim`) is a stateful handle for running experiments on it, available inside `explore_python` / `run_python`
- Same parser, same option model, same executor as `evaluate_option_plan`, so probe rollouts behave identically to capture rollouts
- What it adds is **composability**: stage any state, run partial plans, render, snapshot/restore, and write whole sweep loops in *one* tool call instead of one round-trip per experiment
- By construction **nothing the probe executes can be captured**; the evaluator is reachable only as a gated read-only preview
- Which BeliefSim it probes depends on the session:
  - solve sessions: the **deployed** belief model
  - synthesis: the **candidate** `simulator.py` under edit, auto-refit on every file change

Note: In the codebase the class is BeliefProbe in agent_sdk/belief_probe.py. This is the workhorse: in this run the agent made ~40 explore_python calls per solve session, most of them multi-experiment sweeps. The identical-machinery point is important: a probe result transfers one-to-one to the capture path, so the agent can trust its experiments.

---

## BeliefProbe: the full API

```python
# state control
sim.reset(task_idx=None, mods=None)   # go to a task's initial state; mods = feature overrides
sim.snapshot() -> int                 # bank a copy of the current state
sim.restore(id) / sim.drop(id) / sim.clear_snapshots()

# introspection
sim.task(task_idx=None) -> str        # goal, objects, initial atoms + state digest
sim.state(obj_name=None) -> dict      # full-precision {obj: {feature: value}}
sim.atoms() -> list[str]              # ground atoms true in the current state
sim.render(label, annotations=None)   # save a scene image; optional marker/line overlays

# rollouts (same grammar as evaluate_option_plan)
sim.run(plan_text, render=True, trials=1, solved=False, contacts=False)
sim.refine(sketch_text, timeout=60.0, max_samples_per_step=None,
           require_goal=False, require_solved=False)

# synthesis sessions only
sim.fit(traj_idxs=None, fixed=None)   # fit candidate simulator params; returns the report
sim.residuals(max_transitions=100, fit_params=False, ...)  # per-feature residuals vs data
```

Methods chain (`reset` returns `sim`), so a whole sweep fits in one `explore_python` call.
<!-- .element: class="small" -->

Note: The next three slides walk through these groups with real calls from the run. Gates worth remembering: run's evaluator preview requires trials >= 2 and solved=True; refine searches from the CURRENT state, so a snapshot plus refine gives suffix-only refinement; fit and residuals raise outside synthesis sessions.

---

## `sim`: state control, introspection, rendering

```python
print(sim.task(0))                 # goal + objects + init digest (no state change)
sim.reset(task_idx=0)              # a task's true initial state
sim.reset(mods={"domino_2": {"x": 0.60, "y": 1.324, "yaw": -1.5708}})
                                   # counterfactual copy: stage any layout
sid = sim.snapshot()               # bank the abstract state...
sim.restore(sid)                   # ...and rewind to it later

sim.state("domino_2")              # full-precision {feature: value}
sim.atoms()                        # ground atoms true now (incl. invented preds)

sim.render("bridge_candidates", annotations=[
    {"type": "marker", "position": [0.60, 1.32, 0.50], "label": "cand A"},
    {"type": "line", "from": [0.70, 1.32, 0.50], "to": [0.405, 1.32, 0.50]},
])                                 # saved image path, viewable with Read
```

- `reset(mods=...)` is the experiment workhorse: test "what if the domino were here" without executing a Pick+Place
- `render` annotations (markers, lines, rectangles) overlay candidate positions and anchors on the scene; used to verify geometry before encoding thresholds
- Snapshots rewind the abstract state only; replays share solver state, so reliability estimates should use `run(trials=N)` instead

Note: The mods form staged nearly all of session 001's bridge-position sweep: reset with a hypothetical blue placement, push, see if the cascade reaches purple. Free visualization is explicitly encouraged in the sandbox CLAUDE.md: render is cheap, physics is not.

---

## `sim.run`: forward rollouts, reliability, contacts

```python
sim.reset()
out = sim.run("Push(robot:robot, domino_0:domino)[0.06, 0.05]")
print(out)          # per-step: actions, atoms added/deleted, failures,
                    # SUBGOAL NOT REACHED lines, saved images

# Reliability estimate: same plan, N trials, fresh physics env +
# decorrelated motion-planner seed per trial (honest, not replays):
out = sim.run(full_plan, trials=5, solved=True)
# -> "Trials: 5/5 reached the goal, 5/5 scored solved=True by the
#     task evaluator" with per-trial reward

# Causal diagnosis: which bodies actually touched what, per step:
out = sim.run(plan, contacts=True)
# -> "robot:gripper_link <-> domino_0 (actions 12-31); ..."
```

- Subgoal annotations in the plan text are **checked**, making a single continuous `run` the forward-validation pass after a `refine`
- `solved=True` needs trials >= 2 and a pristine `reset()`: the evaluator preview before submitting, instead of discovering rejections one capture at a time
- `contacts=True` answers "did the push cause the topple, or did the arm brush it?"

Note: In this run the agent used run(trials=5, solved=True) to verify 5/5 solves at reward 0.90 during exploration, and 10/10 before submitting the test plan. The trials results explicitly label whether the env was fresh per trial, and warn when a goal-reaching route is scored a non-solve: "tuning its parameters cannot make it pass, plan a different route".

---

## `sim.refine`: backtracking parameter search

```python
sim.reset()
print(sim.refine("""
Pick(robot:robot, domino_2:domino)[0.05] -> {Holding(robot:robot, domino_2:domino)}
Place(robot:robot)[0.60, 1.324, 0.55, -1.57] ~ [0.05, 0.05, 0.0, 0.5]
    -> {AtBridgePoint(domino_2:domino, domino_0:domino, domino_1:domino)}
Push(robot:robot, domino_0:domino)[0.06, 0.05] -> {Toppled(domino_0:domino)}
""", require_solved=True))
```

- Per-step seeding is independent: full `[params]` = seed, tried first (exactly once); an explicit `[]` on a parametrized option = "no seed, let the search choose" - so a known Pick can be pinned while Place is searched
- When a seed fails (or a step has none), sampling falls back per draw: learned per-option sampler if loaded, else **uniform over the option's whole parameter box** (up to 50 samples/step, backtracking on failure); `~ [w]` half-width windows confine sampling only when ground samplers are enabled (`agent_bilevel_ground_samplers`, off by default - the annotation is then accepted but ignored, with a NOTE)
- Composable: refine a plan **suffix** from a snapshot, so budget goes to the step that matters
- Result states exactly what SUCCESS certifies: `executed` → `goal-reached` → `evaluator-solved` (a bare "SUCCESS" is never over-read)
- Reports refined params ready to paste into `evaluate_option_plan`, plus the **deepest near-miss** (step, best params, why they failed) on failure
- Refine-pass + diverging forward `run` = the learned model is **more permissive** than the env; the fix is to tighten thresholds, never loosen

Note: Refinement resets state between options and resamples; the forward run carries state continuously. Divergence between the two is the canonical symptom of an over-loose learned gate, and the system prompt drills the rule of thumb: tighten toward the env's empirical boundary.

---

## Learning (synthesis) sessions: write the world model

**Inputs**

- All trajectories so far (demos + every interaction, **failures included**), with per-episode env rewards
- A residual scan hint: which features the base sim mis-predicts
- Ground-truth checks: `is_goal_state`; types, options digest, the predicate allowlist (just `Holding`)

**Workflow**

1. Explore data with `run_python`: what changes per step, what the base sim fails to explain
2. `Write` / `Edit` `simulator.py`; every save is version-snapshotted
3. Fast inner loop: `sim.fit()` + `sim.residuals()` (negative "vs base" = a rule is hurting)
4. Invent predicates in `predicates.py`; validate with `evaluate_predicate_quality`
5. Slow outer gate: `sim.refine` then a continuous `sim.run` must **both** pass

Note: The learn prompt for this run: 2 trajectories, 267 transitions, both failed episodes. The residual hint pointed at domino roll/x/yaw/z. The candidate-probe design means sim.run/refine inside synthesis always exercise the latest edit, freshly fitted. Failure trajectories are treated as counterexamples: places where a predicate said "this should work" but the env disagreed indicate a too-loose threshold.

## `sim.fit`: Bayesian MAP fitting with honest identifiability

Actual fit report from session 003:
<!-- .element: class="small" -->

```text
lateral_friction   [physical] 0.1000 -> 0.5315  (delta=+0.4315, +431.5%)

Identifiability (posterior_std / prior_std; ~1 means the data did NOT
constrain the parameter - its fitted value is arbitrary):
  lateral_friction  posterior_std=0.124  prior_std=0.75  contraction=0.17  -> identified

The identified physical params were applied to the planning base env;
probe rollouts (sim.run / sim.refine) now run against the calibrated sim.
```

- **Objective:** Gaussian MAP on free-running rollouts (SSE + prior, log-space for log-scale params); grid-seeded Levenberg-Marquardt point fit
- Per-parameter verdicts gate deployment: only **identified** / **weakly identified** values (contraction < 0.7) are applied; **NOT identified / at bound / anchored / insensitive** keep the baseline
- Both seeds independently recovered ~0.50 (true 0.5)

Note: Verdict details, keyed on contraction = posterior_std / prior_std (~1 = data taught nothing): identified < 0.3 and weakly identified < 0.7 are applied; NOT identified >= 0.7 means posterior ~= prior so the MAP is arbitrary; at bound means the MAP pinned to its box edge (data pushing it outside the plausible range, usually absorbing model error); anchored means a refit with the baseline held is data-equivalent, so the fitted move was compensatory; insensitive means rollouts never respond above the noise floor anywhere in the box; INCONSISTENT across cycles fires when two cycles' confident fits disagree by many combined sigmas. Posterior widths are empirical, not the optimizer's covariance: the half-width of the grid sweep's data-equivalent interval (curvature probe as fallback), floored at 0.1 because local widths cannot see replay model bias. emcee MCMC is opt-in and off in our experiments. True env friction is 0.5; seed 1 fit 0.48 to 0.53 across trajectory subsets (contraction 0.13 to 0.17, SSE 827 to ~0.1), seed 0 independently 0.500 to 0.503. The posterior width also feeds the capture-time physics-margin gate: wide posterior means harder capture, which rewards informative exploration.

## What the agent actually learned in this run

```python
# simulator.py - pure system identification
PROCESS_RULES = []            # no hidden process: dynamics are rigid-body
PARAM_SPECS = [               # no SSE signal; exist to share thresholds
    ParamSpec("bridge_frac", 0.485, 0.0, 1.0),      # with predicates via
    ParamSpec("topple_thresh", 1.0, 0.3, 1.5), ...  # the live `params` view
]
PHYSICAL_PARAMS = [
    ParamSpec("lateral_friction", 0.1, lo=0.01, hi=2.0),   # fit -> ~0.5
]

# predicates.py - 3 invented predicates
# Toppled(d):        |roll| >= topple_thresh
# UprightAtRest(d):  |roll| < upright_thresh, and not held
# AtBridgePoint(blue, start, target): blue sits at a learned FRACTION of
#     the start->target line (rotation-aware, along/perp tolerances), upright
```

- Correct diagnosis: residuals were on **rigid-body motion itself**, so it declared `PHYSICAL_PARAMS` instead of inventing bogus process rules (a physics-only artifact is valid)
- Thresholds fitted empirically by bucketing trajectory steps, not guessed
- `AtBridgePoint` is relational, so it transfers across layouts; these atoms then appear in test-time initial states and drive subgoal monitoring

Note: Under partial observability the same file could carry recurrent 5-arg rules with a latent dict (counter-threshold or latent-plus-readout patterns); this task needed none.

---

## Memory and the loop closing

- **Journal** (`record_journal`): after each attempt the agent records task facts, physics findings ("reach cone per hop: dx <= 0.06, dy <= 0.16"), gotchas, and the working plan; journals are fed to later attempts and cycles
- **Session logs**: every past query + tool result is on disk in the sandbox; later sessions Glob/Read them to avoid re-deriving results
- **Versioned snapshots**: every `simulator.py` / `predicates.py` save is archived; fit reports are tagged `[cycle_XXX_vers_YYY]` for diffing
- **Execution monitoring**: captured subgoal annotations are checked on the real env at each step; divergence triggers replanning rather than silent failure
- **Early stopping**: cycle 1 solved 2/2 train attempts with the calibrated model, so the run stopped; final test result: **1/1 solved, reward 0.70** (identical on seed 0)

Note: The journal is what makes the 5-attempt solve budget cumulative rather than 5 cold starts: attempt 2 starts from attempt 1's physics facts. Fresh-context solves plus journal is the configuration in this arm.
