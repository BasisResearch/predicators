[build-system]
requires = ["scikit-build-core>=0.8"]
build-backend = "scikit_build_core.build"

[project]
name = "pybullet"
version = "3.2.7"
description = "Pyodide-targeted build of pybullet (headless physics only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "zlib" }
authors = [
    { name = "Erwin Coumans, Yunfei Bai, Jasmine Hsu" },
]
dependencies = ["numpy"]
