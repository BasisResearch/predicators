task_text: >-
  Plug the plug into the outlet. The plug is the small dark block standing in a
  collar on the table; underneath it are two flat blades and a round pin. The
  outlet is the pale block with three matching holes in its top face. Grasp the
  plug by its block, lift it, and seat all three legs in the holes.
